<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M-11 긴급 연락처</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #F4F6F9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .phone-shell {
      width: 390px;
      min-height: 100vh;
      background: #F4F6F9;
      position: relative;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      background: #FFFFFF;
      padding: 52px 20px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #D1D9E6;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-back {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: #F4F6F9;
      cursor: pointer;
      border: none;
      flex-shrink: 0;
    }
    .header-back svg { display: block; }
    .header-title {
      font-size: 18px;
      font-weight: 700;
      color: #1A2332;
    }

    /* Content */
    .content {
      padding: 24px 16px 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* SOS Button */
    .sos-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
    }
    .sos-btn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #E53935;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 0 0 8px rgba(229, 57, 53, 0.15), 0 8px 32px rgba(229, 57, 53, 0.35);
      transition: transform 0.1s, box-shadow 0.1s;
      position: relative;
    }
    .sos-btn::before {
      content: '';
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 2px dashed rgba(229, 57, 53, 0.35);
      animation: pulse-ring 2s ease-in-out infinite;
    }
    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.5; }
    }
    .sos-btn:active { transform: scale(0.96); box-shadow: 0 0 0 4px rgba(229, 57, 53, 0.15), 0 4px 16px rgba(229, 57, 53, 0.3); }
    .sos-btn-label {
      font-size: 28px;
      font-weight: 900;
      color: #fff;
      letter-spacing: 2px;
    }
    .sos-btn-sub {
      font-size: 10px;
      font-weight: 500;
      color: rgba(255,255,255,0.85);
      letter-spacing: 0.5px;
    }
    .sos-desc {
      font-size: 13px;
      color: #546E7A;
      text-align: center;
      line-height: 1.6;
      max-width: 280px;
    }
    .sos-desc strong { color: #E53935; font-weight: 700; }

    /* Section label */
    .section-label {
      width: 100%;
      font-size: 13px;
      font-weight: 700;
      color: #546E7A;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* Contact Cards */
    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .contact-card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .contact-card.danger {
      border: 1.5px solid rgba(229, 57, 53, 0.25);
      background: #FFF5F5;
    }

    .contact-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #EBF3FD;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .contact-card.danger .contact-icon {
      background: rgba(229, 57, 53, 0.1);
    }

    .contact-info { flex: 1; min-width: 0; }
    .contact-name {
      font-size: 15px;
      font-weight: 700;
      color: #1A2332;
      margin-bottom: 2px;
    }
    .contact-card.danger .contact-name { color: #E53935; }
    .contact-number {
      font-size: 13px;
      color: #546E7A;
    }
    .contact-card.danger .contact-number {
      color: #E53935;
      font-weight: 600;
    }

    .contact-relation {
      font-size: 11px;
      color: #546E7A;
      margin-top: 2px;
    }

    .call-btn {
      height: 40px;
      padding: 0 16px;
      border-radius: 10px;
      border: none;
      background: #2B7FE0;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .call-btn:hover { background: #1A5FB4; }
    .contact-card.danger .call-btn {
      background: #E53935;
    }
    .contact-card.danger .call-btn:hover { background: #c62828; }

    /* Tab Bar */
    .tab-bar {
      position: fixed;
      bottom: 0;
      width: 390px;
      height: 64px;
      background: #FFFFFF;
      border-top: 1px solid #D1D9E6;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 200;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      flex: 1;
      padding: 8px 0;
      text-decoration: none;
      color: #546E7A;
    }
    .tab-item svg { width: 24px; height: 24px; }
    .tab-label {
      font-size: 11px;
      font-weight: 600;
      color: #546E7A;
    }
    .tab-item.active { color: #2B7FE0; }
    .tab-item.active .tab-label { color: #2B7FE0; font-weight: 700; }
  </style>
</head>
<body>
<div class="phone-shell">

  <!-- Header -->
  <div class="header">
    <button class="header-back" aria-label="뒤로가기">

  <!-- Content -->

          전화

      <!-- 담당의 -->
      <div class="contact-card">
        <div class="contact-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">

          </svg>
        </div>
        <div class="contact-info">
          <div class="contact-name">담당의 박원장</div>
          <div class="contact-number">031-123-4567</div>
          <div class="contact-relation">한마음내과 · 주치의</div>
        </div>
        <button class="call-btn" onclick="window.location.href='tel:0311234567'">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="display:inline;vertical-align:middle;margin-right:4px">
            <path d="M6.62 10.79C8.06 13.62 10.38 15.93 13.21 17.38L15.41 15.18C15.68 14.91 16.08 14.82 16.43 14.94C17.55 15.31 18.76 15.51 20 15.51C20.55 15.51 21 15.96 21 16.51V20C21 20.55 20.55 21 20 21C10.61 21 3 13.39 3 4C3 3.45 3.45 3 4 3H7.5C8.05 3 8.5 3.45 8.5 4C8.5 5.25 8.7 6.45 9.07 7.57C9.18 7.92 9.1 8.31 8.82 8.59L6.62 10.79Z" fill="#ffffff"/>
          </svg>
          전화
        </button>
      </div>

      <!-- 119 -->
      <div class="contact-card danger">
        <div class="contact-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="9" fill="rgba(229,57,53,0.1)" stroke="#E53935" stroke-width="1.5"/>
            <path d="M12 7V13" stroke="#E53935" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="12" cy="16" r="1.2" fill="#E53935"/>
          </svg>
        </div>
        <div class="contact-info">
          <div class="contact-name">119 긴급구조</div>
          <div class="contact-number">119</div>
          <div class="contact-relation">소방청 응급구조</div>
        </div>
        <button class="call-btn" onclick="window.location.href='tel:119'">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="display:inline;vertical-align:middle;margin-right:4px">
            <path d="M6.62 10.79C8.06 13.62 10.38 15.93 13.21 17.38L15.41 15.18C15.68 14.91 16.08 14.82 16.43 14.94C17.55 15.31 18.76 15.51 20 15.51C20.55 15.51 21 15.96 21 16.51V20C21 20.55 20.55 21 20 21C10.61 21 3 13.39 3 4C3 3.45 3.45 3 4 3H7.5C8.05 3 8.5 3.45 8.5 4C8.5 5.25 8.7 6.45 9.07 7.57C9.18 7.92 9.1 8.31 8.82 8.59L6.62 10.79Z" fill="#ffffff"/>
          </svg>
          전화

      </div>

    </div>
  </div>

  <!-- Tab Bar -->

</div>

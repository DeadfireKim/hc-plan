<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M-06-S 일정 간단보기 | 헬스케어 앱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    /* ===== 디자인 토큰 (home-simple과 동일) ===== */
    :root {
      --primary:        #2B7FE0;
      --primary-dark:   #1A5FB4;
      --secondary:      #34C4A0;
      --danger:         #E53935;
      --warning:        #F5A623;
      --purple:         #9C27B0;
      --bg:             #F4F6F9;
      --surface:        #FFFFFF;
      --border:         #D1D9E6;
      --text-primary:   #1A2332;
      --text-secondary: #546E7A;
      --text-disabled:  #B0BEC5;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: #C8D0DC; }

    /* 기획 의도: 시니어 가독성 — body 18px */
    body {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 18px;
      color: var(--text-primary);
      background: var(--bg);
      max-width: 390px;
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: 80px;
      position: relative;
    }

    /* ===== 앱 헤더 ===== */
    .app-header {
      background: var(--surface);
      padding: 18px 16px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .btn-toggle {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      display: inline-block;
      line-height: 1.4;
      white-space: nowrap;
    }
    .btn-toggle:hover { background: var(--primary-dark); }

    /* ===== 스크롤 영역 ===== */
    .scroll-area {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ===== 날짜 헤더 카드 ===== */
    /* 기획 의도: "오늘이 며칠인지"를 크게 인지 */
    .date-card {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(43,127,224,0.3);
      padding: 22px 22px;
      color: #fff;
    }
    .date-label {
      font-size: 15px;
      opacity: 0.9;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .date-main {
      font-size: 32px;
      font-weight: 900;
      line-height: 1.1;
    }
    .date-sub {
      font-size: 15px;
      opacity: 0.9;
      margin-top: 6px;
    }

    /* ===== 섹션 타이틀 ===== */
    .section-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin: 4px 4px 0;
      padding: 0 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ===== 일정 카드 ===== */
    /* 기획 의도: 시간을 큰 글씨로 표시 (28px),
       일정 이름도 큰 글씨(20px)로 시니어가 한 눈에 파악 */
    .schedule-card {
      background: var(--surface);
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 20px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-left: 6px solid var(--border);
    }
    .schedule-card.appt    { border-left-color: var(--warning); }
    .schedule-card.health  { border-left-color: var(--secondary); }
    .schedule-card.med     { border-left-color: var(--primary); }
    .schedule-card.exercise{ border-left-color: var(--secondary); }
    .schedule-card.family  { border-left-color: var(--warning); }
    .schedule-card.physio  { border-left-color: var(--purple); }

    .sched-time-col {
      flex-shrink: 0;
      min-width: 70px;
      text-align: center;
    }
    .sched-time-ampm {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .sched-time-main {
      font-size: 28px;
      font-weight: 900;
      color: var(--text-primary);
      line-height: 1.1;
    }
    .sched-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 26px;
    }
    .sched-icon.appt     { background: #FFF5E6; }
    .sched-icon.health   { background: #E8FAF5; }
    .sched-icon.med      { background: #EBF3FD; }
    .sched-icon.exercise { background: #E8FAF5; }
    .sched-icon.family   { background: #FFF5E6; }
    .sched-icon.physio   { background: #F3E5F5; }

    .sched-body { flex: 1; min-width: 0; }
    .sched-name {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
      line-height: 1.3;
    }
    .sched-sub {
      font-size: 15px;
      color: var(--text-secondary);
    }

    /* 일정 없음 상태 */
    .empty-card {
      background: var(--surface);
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 28px 20px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 17px;
    }
    .empty-card .empty-icon {
      font-size: 36px;
      margin-bottom: 8px;
    }

    /* 다음 일정까지 카드 */
    .next-up-card {
      background: var(--surface);
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 20px 22px;
      border-left: 6px solid var(--warning);
    }
    .next-up-label {
      font-size: 16px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      font-weight: 500;
    }
    .next-up-time {
      font-size: 38px;
      font-weight: 900;
      color: var(--warning);
      line-height: 1;
      margin-bottom: 10px;
    }
    .next-up-time .ampm {
      font-size: 22px;
      font-weight: 700;
      margin-right: 6px;
    }
    .next-up-name {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .next-up-sub {
      font-size: 15px;
      color: var(--text-secondary);
    }

    /* ===== 하단 탭바 ===== */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 390px;
      height: 64px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: stretch;
      z-index: 300;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
    }
    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      color: var(--text-disabled);
      text-decoration: none;
    }
    .tab-item.active { color: var(--primary); }
    .tab-item svg { width: 24px; height: 24px; }
    .tab-label {
      font-size: 11px;
      font-weight: 600;
    }

    @media (max-width: 375px) {
      .date-main { font-size: 26px; }
      .sched-time-main { font-size: 24px; }
      .next-up-time { font-size: 32px; }
      .tab-bar { width: 100%; }
    }
  </style>
</head>
<body>

  <!-- =============================================
       앱 헤더
       기획 의도: 제목 + "자세히 보기" 토글 → M-06-D 이동
       ============================================= -->
  <header class="app-header">
    <h1 class="header-title">일정 관리</h1>
    <a href="schedule-detail.html" class="btn-toggle">자세히 보기 →</a>
  </header>

  <main class="scroll-area">

    <!-- ────────────────────────────────────────
         오늘 날짜 헤더 카드
         기획 의도: "오늘이 며칠인지" 크게 인지
         ──────────────────────────────────────── -->
    <div class="date-card">
      <div class="date-label">오늘</div>
      <div class="date-main">2026년 4월 25일</div>
      <div class="date-sub">토요일 · 일정 2개</div>
    </div>

    <!-- ────────────────────────────────────────
         다음 일정 (큰 시간 강조)
         기획 의도: "가장 가까운 다음 일정"을 크게 표시
         ──────────────────────────────────────── -->
    <div class="next-up-card">
      <div class="next-up-label">⏰ 다음 일정</div>
      <div class="next-up-time"><span class="ampm">오전</span>10:00</div>
      <div class="next-up-name">내과 진료</div>
      <div class="next-up-sub">한마음내과 · 박원장</div>
    </div>

    <!-- ────────────────────────────────────────
         오늘 일정 목록
         기획 의도: 시간/이름 모두 큰 폰트 (시니어 가독성)
         ──────────────────────────────────────── -->
    <div class="section-title">📅 오늘 일정</div>

    <div class="schedule-card appt">
      <div class="sched-time-col">
        <div class="sched-time-ampm">오전</div>
        <div class="sched-time-main">10:00</div>
      </div>
      <div class="sched-icon appt">🏥</div>
      <div class="sched-body">
        <div class="sched-name">내과 진료</div>
        <div class="sched-sub">한마음내과 · 박원장</div>
      </div>
    </div>

    <div class="schedule-card health">
      <div class="sched-time-col">
        <div class="sched-time-ampm">오후</div>
        <div class="sched-time-main">3:00</div>
      </div>
      <div class="sched-icon health">❤️</div>
      <div class="sched-body">
        <div class="sched-name">혈압 측정</div>
        <div class="sched-sub">자가 측정 · 기록 필요</div>
      </div>
    </div>

    <!-- ────────────────────────────────────────
         내일 일정 미리보기
         기획 의도: "내일 뭐 있지?"를 한 눈에
         ──────────────────────────────────────── -->
    <div class="section-title" style="margin-top:8px;">📆 내일 (4/26 일)</div>

    <div class="schedule-card med">
      <div class="sched-time-col">
        <div class="sched-time-ampm">오전</div>
        <div class="sched-time-main">9:00</div>
      </div>
      <div class="sched-icon med">💊</div>
      <div class="sched-body">
        <div class="sched-name">약 복용</div>
        <div class="sched-sub">혈압약 · 비타민</div>
      </div>
    </div>

  </main>

  <!-- =============================================
       하단 탭바 (일정 탭 활성)
       ============================================= -->
  <nav class="tab-bar" aria-label="하단 메뉴">
    <a href="home-simple.html" class="tab-item">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
      <span class="tab-label">홈</span>
    </a>
    <a href="health-simple.html" class="tab-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
      </svg>
      <span class="tab-label">건강</span>
    </a>
    <a href="medication-simple.html" class="tab-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      <span class="tab-label">복약</span>
    </a>
    <a href="schedule-simple.html" class="tab-item active" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span class="tab-label">일정</span>
    </a>
    <a href="settings.html" class="tab-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
      <span class="tab-label">설정</span>
    </a>
  </nav>

</body>
</html>

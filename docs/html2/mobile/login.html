<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | HealthCare Watch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary:      #2B7FE0;
      --primary-dark: #1A5FB4;
      --bg:           #F4F6F9;
      --surface:      #FFFFFF;
      --border:       #D1D9E6;
      --text-primary: #1A2332;
      --text-sub:     #546E7A;
      --text-hint:    #90A4AE;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: #C8D0DC; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      max-width: 390px;
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    /* ── 상단 배경 그라디언트 ── */
    .hero {
      background: linear-gradient(160deg, var(--primary) 0%, var(--primary-dark) 60%, #0D3B7A 100%);
      flex: 0 0 52%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 32px 56px;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      width: 300px; height: 300px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      top: -80px; right: -60px;
    }
    .hero::after {
      content: '';
      position: absolute;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      bottom: 20px; left: -40px;
    }

    .app-logo {
      width: 88px; height: 88px;
      border-radius: 22px;
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center;
      font-size: 46px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      position: relative; z-index: 1;
    }
    .app-name {
      font-size: 26px; font-weight: 700;
      color: #fff; letter-spacing: -0.5px;
      margin-bottom: 8px;
      position: relative; z-index: 1;
    }
    .app-tagline {
      font-size: 14px; color: rgba(255,255,255,0.72);
      font-weight: 400; text-align: center;
      position: relative; z-index: 1;
    }

    /* ── 하단 카드 영역 ── */
    .card-area {
      background: var(--surface);
      flex: 1;
      border-radius: 28px 28px 0 0;
      margin-top: -24px;
      padding: 36px 28px 40px;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-size: 22px; font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .card-sub {
      font-size: 14px; color: var(--text-sub);
      margin-bottom: 32px; line-height: 1.5;
    }

    /* ── Google 로그인 버튼 ── */
    .google-btn {
      width: 100%;
      display: flex; align-items: center; justify-content: center;
      gap: 12px;
      padding: 16px 24px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-family: inherit;
      font-size: 16px; font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.18s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .google-btn:hover { background: #F8FAFF; border-color: var(--primary); }
    .google-btn:active { transform: scale(0.98); }
    .google-icon {
      width: 22px; height: 22px; flex-shrink: 0;
    }


    .spacer { flex: 1; }

    /* ── 약관 ── */
    .terms {
      text-align: center;
      font-size: 12px; color: var(--text-hint);
      line-height: 1.6;
    }
    .terms a {
      color: var(--primary); text-decoration: none; font-weight: 600;
    }

    /* ── 로딩 오버레이 ── */
    .loading-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(255,255,255,0.92);
      flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; z-index: 999;
    }
    .loading-overlay.show { display: flex; }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      font-size: 15px; font-weight: 600; color: var(--text-sub);
    }
    .loading-sub {
      font-size: 13px; color: var(--text-hint); margin-top: -10px;
    }

    /* ── Google OAuth 팝업 시뮬레이션 ── */
    .oauth-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      align-items: center; justify-content: center;
      z-index: 900; padding: 20px;
    }
    .oauth-overlay.show { display: flex; }
    .oauth-popup {
      background: #fff;
      border-radius: 16px;
      width: 100%; max-width: 340px;
      overflow: hidden;
      box-shadow: 0 16px 64px rgba(0,0,0,0.25);
    }
    .oauth-header {
      padding: 20px 24px 14px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .oauth-google-logo { font-size: 22px; }
    .oauth-header-text { font-size: 15px; font-weight: 700; color: var(--text-primary); }
    .oauth-body { padding: 20px 24px; }
    .oauth-account {
      display: flex; align-items: center; gap: 12px;
      padding: 14px; border-radius: 12px;
      border: 1.5px solid var(--primary); background: #EBF3FF;
      cursor: pointer; margin-bottom: 10px;
      transition: background 0.1s;
    }
    .oauth-account:hover { background: #D6E8FF; }
    .oauth-account-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, #2B7FE0, #34C4A0);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .oauth-account-name { font-size: 15px; font-weight: 700; color: var(--text-primary); }
    .oauth-account-email { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
    .oauth-other {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; border-radius: 10px;
      cursor: pointer; color: var(--text-sub); font-size: 14px;
    }
    .oauth-other:hover { background: var(--bg); }
    .oauth-footer {
      padding: 14px 24px 20px;
      display: flex; justify-content: flex-end; gap: 8px;
      border-top: 1px solid var(--bg);
    }
    .oauth-cancel {
      padding: 9px 18px; border-radius: 8px;
      border: 1px solid var(--border); background: #fff;
      font-family: inherit; font-size: 14px; font-weight: 600;
      color: var(--text-sub); cursor: pointer;
    }
    .oauth-confirm {
      padding: 9px 18px; border-radius: 8px;
      border: none; background: var(--primary);
      color: #fff; font-family: inherit;
      font-size: 14px; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 상단 히어로 -->
  <div class="hero">
    <div class="app-logo">💙</div>
    <div class="app-name">HealthCare Watch</div>
    <div class="app-tagline">시니어를 위한 스마트 건강 관리</div>
  </div>

  <!-- 하단 로그인 카드 -->
  <div class="card-area">
    <div class="card-title">시작하기</div>
    <div class="card-sub">간편하게 로그인하고<br>오늘의 건강을 확인하세요.</div>

    <!-- Google 로그인 -->
    <button class="google-btn" onclick="openOAuth()">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Google로 계속하기
    </button>

    <div class="spacer"></div>

    <div class="terms">
      로그인하면 HealthCare Watch의
      <a href="#">이용약관</a> 및 <a href="#">개인정보처리방침</a>에
      동의하는 것으로 간주합니다.
    </div>
  </div>

  <!-- Google OAuth 팝업 시뮬레이션 -->
  <div class="oauth-overlay" id="oauth-overlay" onclick="handleOverlayClick(event)">
    <div class="oauth-popup">
      <div class="oauth-header">
        <span class="oauth-google-logo">G</span>
        <span class="oauth-header-title" style="font-size:16px;font-weight:700;">Google 계정으로 로그인</span>
      </div>
      <div class="oauth-body">
        <div style="font-size:13px;color:#546E7A;margin-bottom:14px;">HealthCare Watch에서 사용할 계정을 선택하세요.</div>
        <div class="oauth-account" onclick="confirmLogin()">
          <div class="oauth-account-avatar">김</div>
          <div>
            <div class="oauth-account-name">김순자</div>
            <div class="oauth-account-email">soonja.kim@gmail.com</div>
          </div>
        </div>
        <div class="oauth-other" onclick="confirmLogin()">
          <span style="font-size:20px;">+</span>
          <span>다른 계정 사용</span>
        </div>
      </div>
      <div class="oauth-footer">
        <button class="oauth-cancel" onclick="closeOAuth()">취소</button>
        <button class="oauth-confirm" onclick="confirmLogin()">계속</button>
      </div>
    </div>
  </div>

  <!-- 로딩 오버레이 -->
  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Google 계정 인증 중...</div>
    <div class="loading-sub">잠시만 기다려 주세요</div>
  </div>

<script>
  function openOAuth() {
    document.getElementById('oauth-overlay').classList.add('show');
  }
  function closeOAuth() {
    document.getElementById('oauth-overlay').classList.remove('show');
  }
  function handleOverlayClick(e) {
    if (e.target === document.getElementById('oauth-overlay')) closeOAuth();
  }
  function confirmLogin() {
    closeOAuth();
    document.getElementById('loading').classList.add('show');
    setTimeout(() => {
      window.location.href = 'home-simple.html';
    }, 2000);
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M-14 계정 전환</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #F4F6F9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .phone-shell {
      width: 390px;
      min-height: 100vh;
      background: #F4F6F9;
      position: relative;
    }

    /* Header */
    .header {
      background: #FFFFFF;
      padding: 52px 20px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #D1D9E6;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-back {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: #F4F6F9;
      cursor: pointer;
      border: none;
      flex-shrink: 0;
    }
    .header-title {
      font-size: 18px;
      font-weight: 700;
      color: #1A2332;
    }

    /* Content */
    .content {
      padding: 24px 16px 100px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Section label */
    .section-label {
      font-size: 12px;
      font-weight: 700;
      color: #546E7A;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: -8px;
    }

    /* Current Account (My Account) */
    .current-card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 18px 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      border: 2px solid #2B7FE0;
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
    }
    .current-badge {
      position: absolute;
      top: -1px;
      right: 14px;
      background: #2B7FE0;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 0 0 8px 8px;
      letter-spacing: 0.3px;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .avatar-me { background: #EBF3FD; color: #2B7FE0; }
    .avatar-mom { background: #FFF0F6; color: #E91E8C; }
    .avatar-dad { background: #E8F5E9; color: #388E3C; }

    .account-info { flex: 1; min-width: 0; }
    .account-name {
      font-size: 16px;
      font-weight: 700;
      color: #1A2332;
      margin-bottom: 3px;
    }
    .account-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      background: #EBF3FD;
      color: #2B7FE0;
      margin-bottom: 4px;
    }
    .account-desc {
      font-size: 12px;
      color: #546E7A;
      line-height: 1.5;
    }

    .check-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #2B7FE0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Parent Account Cards */
    .parent-card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 18px 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .parent-card-top {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .parent-info { flex: 1; min-width: 0; }
    .parent-name {
      font-size: 15px;
      font-weight: 700;
      color: #1A2332;
      margin-bottom: 3px;
    }
    .parent-age {
      font-size: 12px;
      color: #546E7A;
      margin-bottom: 6px;
    }
    .health-summary {
      font-size: 12px;
      color: #546E7A;
      background: #F4F6F9;
      border-radius: 8px;
      padding: 6px 10px;
      line-height: 1.5;
    }
    .health-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }
    .dot-ok { background: #34C4A0; }
    .dot-warn { background: #F5A623; }

    .switch-btn {
      height: 44px;
      border-radius: 10px;
      border: 1.5px solid #2B7FE0;
      background: #fff;
      color: #2B7FE0;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      width: 100%;
    }
    .switch-btn:hover {
      background: #2B7FE0;
      color: #fff;
    }

    /* Add Account Button */
    .add-account-btn {
      height: 56px;
      border-radius: 12px;
      border: 2px dashed #D1D9E6;
      background: #fff;
      color: #546E7A;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: border-color 0.15s, color 0.15s;
      width: 100%;
    }
    .add-account-btn:hover {
      border-color: #2B7FE0;
      color: #2B7FE0;
    }

    /* Info box */
    .info-box {
      background: #EBF3FD;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .info-box svg { flex-shrink: 0; margin-top: 1px; }
    .info-box-text {
      font-size: 12px;
      color: #1A5FB4;
      line-height: 1.6;
    }

    /* Tab Bar */
    .tab-bar {
      position: fixed;
      bottom: 0;
      width: 390px;
      height: 64px;
      background: #FFFFFF;
      border-top: 1px solid #D1D9E6;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 200;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      flex: 1;
      padding: 8px 0;
      text-decoration: none;
      color: #546E7A;
    }
    .tab-item svg { width: 24px; height: 24px; }
    .tab-label {
      font-size: 11px;
      font-weight: 600;
      color: #546E7A;
    }
    .tab-item.active { color: #2B7FE0; }
    .tab-item.active .tab-label { color: #2B7FE0; font-weight: 700; }
  </style>
</head>
<body>
<div class="phone-shell">

  <!-- Header -->
  <div class="header">
    <button class="header-back" aria-label="뒤로가기">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M12 15L7 10L12 5" stroke="#1A2332" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span class="header-title">계정 선택</span>
  </div>

  <!-- Content -->
  <div class="content">

    <!-- My Account -->
    <div class="section-label">현재 계정</div>
    <div class="current-card">
      <div class="current-badge">현재 로그인</div>
      <div class="avatar avatar-me">나</div>
      <div class="account-info">
        <div class="account-name">내 계정 (시니어)</div>
        <span class="account-tag">시니어 본인</span>
        <div class="account-desc">김순자 · 75세 · 나의 건강 데이터</div>
      </div>
      <div class="check-icon">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M3 8L6.5 11.5L13 5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <!-- Connected Parents -->
    <div class="section-label">연결된 부모 계정</div>

    <!-- Mother -->
    <div class="parent-card">
      <div class="parent-card-top">
        <div class="avatar avatar-mom">모</div>
        <div class="parent-info">
          <div class="parent-name">어머니 김순자</div>
          <div class="parent-age">75세 · 여성</div>
          <div class="health-summary">
            <span class="health-dot dot-ok"></span>오늘 혈압 정상 · 복약 2/3 완료 · 걸음 3,200보
          </div>
        </div>
      </div>
      <button class="switch-btn">이 계정으로 전환</button>
    </div>

    <!-- Father -->
    <div class="parent-card">
      <div class="parent-card-top">
        <div class="avatar avatar-dad">부</div>
        <div class="parent-info">
          <div class="parent-name">아버지 이철수</div>
          <div class="parent-age">78세 · 남성</div>
          <div class="health-summary">
            <span class="health-dot dot-warn"></span>혈당 주의 · 복약 1/4 완료 · 오늘 진료 예정
          </div>
        </div>
      </div>
      <button class="switch-btn">이 계정으로 전환</button>
    </div>

    <!-- Add Account -->
    <button class="add-account-btn">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <circle cx="10" cy="10" r="8" stroke="#546E7A" stroke-width="1.6" fill="none"/>
        <path d="M10 6V14M6 10H14" stroke="#546E7A" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      부모 계정 추가
    </button>

    <!-- Info Box -->
    <div class="info-box">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="8" r="7" stroke="#2B7FE0" stroke-width="1.4" fill="none"/>
        <path d="M8 7V12" stroke="#2B7FE0" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="8" cy="4.5" r="1" fill="#2B7FE0"/>
      </svg>
      <div class="info-box-text">
        계정 전환 후에는 선택한 부모님의 건강 데이터를 확인하고 복약 알림을 보낼 수 있습니다. 부모님 동의 후 연결이 가능합니다.
      </div>
    </div>

  </div>

  <!-- Tab Bar -->
  <nav class="tab-bar" aria-label="하단 메뉴">
    <a href="home-simple.html" class="tab-item">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
      <span class="tab-label">홈</span>
    </a>
    <a href="health-simple.html" class="tab-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
      </svg>
      <span class="tab-label">건강</span>
    </a>
    <a href="medication-simple.html" class="tab-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      <span class="tab-label">복약</span>
    </a>
    <a href="schedule-simple.html" class="tab-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span class="tab-label">일정</span>
    </a>
    <a href="settings.html" class="tab-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
      <span class="tab-label">설정</span>
    </a>
  </nav>

</div>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>검토 이력 — HC-Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    /* 기간 필터 */
    .period-btns {
      display: flex;
      gap: var(--space-1);
    }

    .period-btn {
      padding: var(--space-1) var(--space-3);
      font-size: var(--text-xs);
      font-weight: var(--font-medium);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-full);
      background: var(--bg-base);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .period-btn.active,
    .period-btn:hover {
      background: var(--color-primary-600);
      border-color: var(--color-primary-600);
      color: #fff;
    }

    /* 통계 바 */
    .stat-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-4);
      margin-bottom: var(--space-6);
    }

    .stat-card {
      background: var(--bg-base);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      text-align: center;
    }

    .stat-card__val {
      font-size: var(--text-2xl);
      font-weight: var(--font-bold);
      color: var(--text-primary);
    }

    .stat-card__label {
      font-size: var(--text-xs);
      color: var(--text-secondary);
      margin-top: var(--space-1);
    }

    /* 이력 테이블 */
    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--text-sm);
    }

    .history-table th {
      background: var(--color-primary-700);
      color: #ffffff;
      padding: var(--space-2) var(--space-4);
      text-align: left;
      font-weight: var(--font-semibold);
      font-size: var(--text-xs);
      white-space: nowrap;
    }

    .history-table td {
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--border-default);
      font-size: var(--text-sm);
      color: var(--text-primary);
      vertical-align: top;
    }

    .history-table tr:last-child td { border-bottom: none; }
    .history-table tbody tr:hover td { background: var(--bg-surface); }

    .opinion-excerpt {
      font-size: var(--text-xs);
      color: var(--text-secondary);
      line-height: 1.6;
      max-width: 300px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .type-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: var(--font-semibold);
      padding: 2px 8px;
      border-radius: var(--radius-full);
    }

    /* ── 사이드바 접기/펼치기 ── */
    .sidebar__collapse-btn {
      margin-left: auto;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: var(--radius-sm);
      color: var(--color-primary-400);
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    .sidebar__collapse-btn:hover {
      background: rgba(255,255,255,0.1);
      color: #ffffff;
    }
    body.sidebar-collapsed .sidebar { transform: translateX(-240px); }
    body.sidebar-collapsed .main-header { left: 0; padding-left: 56px; }
    body.sidebar-collapsed .main-content { margin-left: 0; width: 100%; }
    .sidebar      { transition: transform 0.25s ease; }
    .main-header  { transition: left 0.25s ease, padding-left 0.25s ease; }
    .main-content { transition: margin-left 0.25s ease, width 0.25s ease; }
    .sidebar-open-btn {
      display: none;
      position: fixed;
      top: 12px;
      left: 12px;
      width: 36px;
      height: 36px;
      background: var(--color-primary-700);
      border: none;
      border-radius: var(--radius-md);
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #ffffff;
      z-index: 200;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      transition: background 0.15s;
    }
    .sidebar-open-btn:hover { background: var(--color-primary-600); }
    body.sidebar-collapsed .sidebar-open-btn { display: flex; }

    /* 모바일: 사이드바 열기 버튼 항상 표시 */
    @media (max-width: 768px) {
      .sidebar-open-btn { display: flex; }
    }
  </style>
</head>
<body>
<div class="app-shell">

  <nav class="sidebar" id="sidebar">
    <div class="sidebar__logo">
      <div class="sidebar__logo-icon" onclick="location.href='../index.html'" style="cursor:pointer">🩺</div>
      <div onclick="location.href='../index.html'" style="cursor:pointer;flex:1">
        <div class="sidebar__logo-text">HC-Plan</div>
        <div class="sidebar__logo-sub">의사 포털</div>
      </div>
      <div class="sidebar__collapse-btn" onclick="toggleSidebar()" title="사이드바 접기">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
      </div>
    </div>
    <div class="sidebar__nav">
      <div class="sidebar__section-label">환자 관리</div>
      <a href="patient-list.html" class="sidebar__item">
        <svg class="sidebar__item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        위험/이상 환자 목록
      </a>
      <a href="patient-detail.html" class="sidebar__item">
        <svg class="sidebar__item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        환자 상세 &amp; 의견
      </a>
      <a href="history.html" class="sidebar__item active">
        <svg class="sidebar__item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        검토 이력
      </a>
    </div>
    <div class="sidebar__footer">
      <div class="sidebar__user">
        <div class="sidebar__user-avatar">박</div>
        <div class="sidebar__user-info">
          <div class="sidebar__user-name">박재원</div>
          <div class="sidebar__user-role">의사 · 내과</div>
        </div>
      </div>
    </div>
  </nav>
  <!-- 사이드바 접혔을 때 열기 버튼 -->
  <button class="sidebar-open-btn" id="sidebar-open-btn" onclick="toggleSidebar()" title="사이드바 열기">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>



  <header class="main-header">
    <div class="main-header__left">
      <div class="main-header__title">검토 이력</div>
    </div>
    <div class="main-header__right">
      <div class="period-btns">
        <button class="period-btn active" onclick="setPeriod(this,7)">7일</button>
        <button class="period-btn" onclick="setPeriod(this,30)">30일</button>
        <button class="period-btn" onclick="setPeriod(this,90)">90일</button>
        <button class="period-btn" onclick="setPeriod(this,0)">전체</button>
      </div>
    </div>
  </header>

  <main class="main-content">

    <!-- 통계 카드 -->
    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-card__val">18</div>
        <div class="stat-card__label">총 검토 건수</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__val" style="color:var(--color-status-danger)">5</div>
        <div class="stat-card__label">병원 방문 권고</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__val" style="color:var(--color-status-caution)">3</div>
        <div class="stat-card__label">긴급 조치 의견</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__val">4</div>
        <div class="stat-card__label">관련 환자 수</div>
      </div>
    </div>

    <!-- 검색/필터 -->
    <div style="display:flex;gap:var(--space-3);margin-bottom:var(--space-4);flex-wrap:wrap">
      <div style="flex:1;min-width:200px;position:relative">
        <svg width="14" height="14" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-secondary)" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="환자명 검색"
          style="width:100%;padding:8px 12px 8px 30px;font-size:var(--text-sm);border:1px solid var(--border-strong);border-radius:var(--radius-md);outline:none">
      </div>
      <select style="padding:var(--space-2) var(--space-3);font-size:var(--text-sm);border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--bg-base)">
        <option>모든 의견 유형</option>
        <option>검토 의견</option>
        <option>병원 방문 권고</option>
        <option>긴급 조치 필요</option>
        <option>정상 범위 확인</option>
      </select>
      <select style="padding:var(--space-2) var(--space-3);font-size:var(--text-sm);border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--bg-base)">
        <option>모든 환자</option>
        <option>박도현</option>
        <option>정태현</option>
        <option>최지우</option>
        <option>김민준</option>
      </select>
    </div>

    <!-- 이력 테이블 -->
    <div class="card">
      <div class="card__body" style="padding:0">
        <div style="overflow-x:auto">
          <table class="history-table">
            <thead>
              <tr>
                <th>검토일시</th>
                <th>환자</th>
                <th>등급 (당시)</th>
                <th>의견 유형</th>
                <th>의견 내용</th>
                <th>우선순위</th>
                <th>후속 조치</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="historyBody"></tbody>
          </table>
        </div>
      </div>
    </div>

  </main>
</div>

<script>
  const historyData = [
    { date:'2026.04.17 09:00', patient:'박도현', grade:'danger', type:'urgent', opinion:'야간 SpO₂ 93% 지속 — 수면다원검사 즉시 예약 필요. 상담사에게 병원 예약 요청 전달.', priority:'높음', follow:'상담사 전달 완료' },
    { date:'2026.04.16 16:30', patient:'정태현', grade:'danger', type:'urgent', opinion:'심박수 102bpm 이상 지속. 즉각 외래 방문 권고. 가족에게 동반 방문 요청.', priority:'높음', follow:'외래 예약 접수' },
    { date:'2026.04.15 14:00', patient:'최지우', grade:'abnormal', type:'recommend', opinion:'스트레스 지수 61 — 스트레스 관리 프로그램 연결 필요. 심리 상담 병행 권고.', priority:'보통', follow:'상담사 연결 중' },
    { date:'2026.04.14 11:20', patient:'박도현', grade:'danger', type:'review', opinion:'수면 패턴 지속 악화. 야간 산소 저하 횟수 증가 추세. 경과 관찰 지속.', priority:'높음', follow:'모니터링 중' },
    { date:'2026.04.12 10:15', patient:'김민준', grade:'caution', type:'review', opinion:'스트레스 오후 집중 패턴 확인. 정상 범위 내이나 지속 관찰 필요.', priority:'낮음', follow:'완료' },
    { date:'2026.04.10 14:30', patient:'박도현', grade:'danger', type:'recommend', opinion:'수면 중 SpO₂ 3회 이상 95% 미만. 이비인후과 수면클리닉 강력 권고.', priority:'높음', follow:'예약 대기 중' },
    { date:'2026.04.08 16:00', patient:'정태현', grade:'abnormal', type:'review', opinion:'심박수 점진적 상승 중. 혈압 자가 측정 권고. 1주일 후 재확인.', priority:'보통', follow:'완료' },
    { date:'2026.04.05 11:00', patient:'최지우', grade:'caution', type:'normal', opinion:'이번 주 수면 개선 확인. 스트레스 지수 소폭 감소. 현재 상태 유지 권고.', priority:'낮음', follow:'완료' },
    { date:'2026.04.03 09:30', patient:'김민준', grade:'caution', type:'review', opinion:'SpO₂ 95% 미만 2회 관찰. 일회성 가능성 높으나 경과 확인 권장.', priority:'낮음', follow:'완료' },
    { date:'2026.04.01 14:00', patient:'박도현', grade:'abnormal', type:'recommend', opinion:'수면 시간 5시간 이하 지속. 수면 위생 교육 및 취침 루틴 개선 권고.', priority:'보통', follow:'상담사 교육 완료' }
  ];

  const typeConfig = {
    urgent:    { label:'긴급 조치', bg:'rgba(239,68,68,0.12)', color:'var(--color-status-danger)' },
    recommend: { label:'병원 방문 권고', bg:'rgba(249,115,22,0.12)', color:'var(--color-status-abnormal)' },
    review:    { label:'검토 의견', bg:'rgba(59,130,246,0.12)', color:'#3b82f6' },
    normal:    { label:'정상 확인', bg:'rgba(16,185,129,0.12)', color:'var(--color-status-normal)' }
  };

  const gradeColor = { danger:'var(--color-status-danger)', abnormal:'var(--color-status-abnormal)',
    caution:'var(--color-status-caution)', normal:'var(--color-status-normal)' };
  const gradeLabel = { danger:'위험', abnormal:'이상', caution:'주의', normal:'정상' };
  const gradeBg = { danger:'rgba(239,68,68,0.12)', abnormal:'rgba(249,115,22,0.12)',
    caution:'rgba(245,158,11,0.12)', normal:'rgba(16,185,129,0.12)' };

  function renderHistory() {
    document.getElementById('historyBody').innerHTML = historyData.map(h => {
      const t = typeConfig[h.type];
      return `
        <tr>
          <td style="white-space:nowrap;font-size:var(--text-xs);color:var(--text-secondary)">${h.date}</td>
          <td style="font-weight:var(--font-semibold)">${h.patient}</td>
          <td>
            <span style="font-size:10px;font-weight:600;padding:2px 7px;border-radius:100px;background:${gradeBg[h.grade]};color:${gradeColor[h.grade]}">
              ${gradeLabel[h.grade]}
            </span>
          </td>
          <td>
            <span class="type-badge" style="background:${t.bg};color:${t.color}">${t.label}</span>
          </td>
          <td><div class="opinion-excerpt">${h.opinion}</div></td>
          <td style="font-size:var(--text-xs);color:var(--text-secondary)">${h.priority}</td>
          <td style="font-size:var(--text-xs);color:var(--text-secondary)">${h.follow}</td>
          <td>
            <button onclick="window.location='patient-detail.html'"
              style="padding:3px 10px;font-size:11px;border:1px solid var(--border-strong);border-radius:4px;background:var(--bg-base);cursor:pointer;white-space:nowrap">
              상세 보기
            </button>
          </td>
        </tr>
      `;
    }).join('');
  }

  function setPeriod(el, days) {
    document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    renderHistory();
  }


  renderHistory();

  // 사이드바 접기/펼치기
  function toggleSidebar() {
    const sidebar = document.querySelector('.sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    const isMobile = window.matchMedia('(max-width: 768px)').matches;
    if (isMobile) {
      const isOpen = sidebar.classList.contains('open');
      if (isOpen) {
        sidebar.style.transform = 'translateX(-240px)';
        sidebar.classList.remove('open');
        if (overlay) overlay.classList.remove('visible');
      } else {
        sidebar.style.transform = 'translateX(0)';
        sidebar.style.width = '240px';
        sidebar.classList.add('open');
        if (overlay) overlay.classList.add('visible');
      }
    } else {
      document.body.classList.toggle('sidebar-collapsed');
    }
  }
  function closeMobileSidebar() {
    const sidebar = document.querySelector('.sidebar');
    sidebar.style.transform = 'translateX(-240px)';
    sidebar.classList.remove('open');
    const ov = document.getElementById('sidebar-overlay');
    if (ov) ov.classList.remove('visible');
  }
</script>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeMobileSidebar()"></div>
</body>
</html>

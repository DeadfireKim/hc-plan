<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>위험/이상 환자 목록 — HC-Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    /* 요약 KPI */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-4);
      margin-bottom: var(--space-6);
    }

    .kpi-tile {
      background: var(--bg-base);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      display: flex;
      align-items: center;
      gap: var(--space-4);
    }

    .kpi-tile__icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .kpi-tile__val {
      font-size: var(--text-2xl);
      font-weight: var(--font-bold);
      color: var(--text-primary);
      line-height: 1.1;
    }

    .kpi-tile__label {
      font-size: var(--text-xs);
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* 필터 바 */
    .filter-bar {
      display: flex;
      gap: var(--space-3);
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: var(--space-4);
    }

    .filter-search {
      flex: 1;
      min-width: 200px;
      position: relative;
    }

    .filter-search__icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
    }

    .filter-search__input {
      width: 100%;
      padding: var(--space-2) var(--space-3) var(--space-2) 32px;
      font-size: var(--text-sm);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      outline: none;
      color: var(--text-primary);
      background: var(--bg-base);
    }

    .filter-search__input:focus {
      border-color: var(--color-primary-500);
      box-shadow: 0 0 0 3px var(--color-primary-100);
    }

    .filter-select {
      padding: var(--space-2) var(--space-3);
      font-size: var(--text-sm);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      background: var(--bg-base);
      color: var(--text-primary);
      outline: none;
      cursor: pointer;
    }

    /* 환자 테이블 */
    .patient-table {
      width: 100%;
      border-collapse: collapse;
    }

    .patient-table th {
      background: var(--color-primary-700);
      color: #ffffff;
      padding: var(--space-3) var(--space-4);
      text-align: left;
      font-weight: var(--font-semibold);
      font-size: var(--text-xs);
      white-space: nowrap;
    }

    .patient-table th.sortable { cursor: pointer; user-select: none; }
    .patient-table th.sortable:hover { background: var(--color-primary-600); }

    .patient-table td {
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--border-default);
      font-size: var(--text-sm);
      color: var(--text-primary);
      vertical-align: middle;
    }

    .patient-table tr:last-child td { border-bottom: none; }
    .patient-table tbody tr:hover td { background: var(--bg-surface); cursor: pointer; }

    /* 미니 스파크라인 (SVG) */
    .sparkline-svg {
      display: block;
      width: 72px;
      height: 28px;
    }

    /* 새 알림 dot */
    .new-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: var(--radius-full);
      background: var(--color-status-danger);
      margin-right: 4px;
      vertical-align: middle;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%,100% { opacity:1; } 50% { opacity:0.4; }
    }

    /* 뱃지 */
    .grade-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: var(--font-semibold);
      padding: 3px 9px;
      border-radius: var(--radius-full);
    }

    /* 탭 */
    .list-tabs {
      display: flex;
      gap: var(--space-1);
      border-bottom: 2px solid var(--border-default);
      margin-bottom: var(--space-5);
    }

    .list-tab {
      padding: var(--space-2) var(--space-5);
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      color: var(--text-secondary);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color var(--transition-fast);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .list-tab.active {
      color: var(--color-primary-600);
      border-bottom-color: var(--color-primary-600);
    }

    .list-tab__count {
      font-size: 10px;
      font-weight: var(--font-bold);
      padding: 1px 6px;
      border-radius: var(--radius-full);
    }

    @media (max-width: 1100px) {
      .kpi-row { grid-template-columns: repeat(2, 1fr); }
    }

    /* ── 사이드바 접기/펼치기 ── */
    .sidebar__collapse-btn {
      margin-left: auto;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: var(--radius-sm);
      color: var(--color-primary-400);
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    .sidebar__collapse-btn:hover {
      background: rgba(255,255,255,0.1);
      color: #ffffff;
    }
    body.sidebar-collapsed .sidebar { transform: translateX(-240px); }
    body.sidebar-collapsed .main-header { left: 0; padding-left: 56px; }
    body.sidebar-collapsed .main-content { margin-left: 0; width: 100%; }
    .sidebar      { transition: transform 0.25s ease; }
    .main-header  { transition: left 0.25s ease, padding-left 0.25s ease; }
    .main-content { transition: margin-left 0.25s ease, width 0.25s ease; }
    .sidebar-open-btn {
      display: none;
      position: fixed;
      top: 12px;
      left: 12px;
      width: 36px;
      height: 36px;
      background: var(--color-primary-700);
      border: none;
      border-radius: var(--radius-md);
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #ffffff;
      z-index: 200;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      transition: background 0.15s;
    }
    .sidebar-open-btn:hover { background: var(--color-primary-600); }
    body.sidebar-collapsed .sidebar-open-btn { display: flex; }

    /* 모바일: 사이드바 열기 버튼 항상 표시 */
    @media (max-width: 768px) {
      .sidebar-open-btn { display: flex; }
    }
  </style>
</head>
<body>
<div class="app-shell">

  <!-- 사이드바 (의사) -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar__logo">
      <div class="sidebar__logo-icon" onclick="location.href='../index.html'" style="cursor:pointer">🩺</div>
      <div onclick="location.href='../index.html'" style="cursor:pointer;flex:1">
        <div class="sidebar__logo-text">HC-Plan</div>
        <div class="sidebar__logo-sub">의사 포털</div>
      </div>
      <div class="sidebar__collapse-btn" onclick="toggleSidebar()" title="사이드바 접기">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
      </div>
    </div>
    <div class="sidebar__nav">
      <div class="sidebar__section-label">환자 관리</div>
      <a href="patient-list.html" class="sidebar__item active">
        <svg class="sidebar__item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        위험/이상 환자 목록
      </a>
      <a href="patient-detail.html" class="sidebar__item">
        <svg class="sidebar__item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        환자 상세 &amp; 의견
      </a>
      <a href="history.html" class="sidebar__item">
        <svg class="sidebar__item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        검토 이력
      </a>
    </div>
    <div class="sidebar__footer">
      <div class="sidebar__user">
        <div class="sidebar__user-avatar">박</div>
        <div class="sidebar__user-info">
          <div class="sidebar__user-name">박재원</div>
          <div class="sidebar__user-role">의사 · 내과</div>
        </div>
      </div>
    </div>
  </nav>
  <!-- 사이드바 접혔을 때 열기 버튼 -->
  <button class="sidebar-open-btn" id="sidebar-open-btn" onclick="toggleSidebar()" title="사이드바 열기">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>



  <!-- 헤더 -->
  <header class="main-header">
    <div class="main-header__left">
      <div class="main-header__title">위험 · 이상 환자 목록</div>
    </div>
    <div class="main-header__right">
      <span style="font-size:var(--text-xs);color:var(--text-secondary)">마지막 갱신: 2026.04.17 오전 8:00</span>
      <button style="padding:var(--space-2) var(--space-3);border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--bg-base);font-size:var(--text-xs);font-weight:var(--font-medium);cursor:pointer">
        새로고침
      </button>
    </div>
  </header>

  <!-- 메인 콘텐츠 -->
  <main class="main-content">

    <!-- KPI -->
    <div class="kpi-row">
      <div class="kpi-tile">
        <div class="kpi-tile__icon" style="background:rgba(239,68,68,0.12)">🚨</div>
        <div>
          <div class="kpi-tile__val" style="color:var(--color-status-danger)">2</div>
          <div class="kpi-tile__label">위험 환자</div>
        </div>
      </div>
      <div class="kpi-tile">
        <div class="kpi-tile__icon" style="background:rgba(249,115,22,0.12)">⚠️</div>
        <div>
          <div class="kpi-tile__val" style="color:var(--color-status-abnormal)">1</div>
          <div class="kpi-tile__label">이상 환자</div>
        </div>
      </div>
      <div class="kpi-tile">
        <div class="kpi-tile__icon" style="background:rgba(245,158,11,0.12)">△</div>
        <div>
          <div class="kpi-tile__val" style="color:var(--color-status-caution)">1</div>
          <div class="kpi-tile__label">주의 환자</div>
        </div>
      </div>
      <div class="kpi-tile">
        <div class="kpi-tile__icon" style="background:rgba(16,185,129,0.12)">✅</div>
        <div>
          <div class="kpi-tile__val" style="color:var(--color-status-normal)">0</div>
          <div class="kpi-tile__label">미검토 건수</div>
        </div>
      </div>
    </div>

    <!-- 탭 -->
    <div class="list-tabs">
      <div class="list-tab active" onclick="switchTab(this,'all')">
        전체
        <span class="list-tab__count" style="background:var(--bg-muted);color:var(--text-secondary)">4</span>
      </div>
      <div class="list-tab" onclick="switchTab(this,'danger')">
        위험
        <span class="list-tab__count" style="background:rgba(239,68,68,0.15);color:var(--color-status-danger)">2</span>
      </div>
      <div class="list-tab" onclick="switchTab(this,'abnormal')">
        이상
        <span class="list-tab__count" style="background:rgba(249,115,22,0.15);color:var(--color-status-abnormal)">1</span>
      </div>
      <div class="list-tab" onclick="switchTab(this,'caution')">
        주의
        <span class="list-tab__count" style="background:rgba(245,158,11,0.15);color:var(--color-status-caution)">1</span>
      </div>
    </div>

    <!-- 필터 바 -->
    <div class="filter-bar">
      <div class="filter-search">
        <div class="filter-search__icon">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </div>
        <input class="filter-search__input" type="text" placeholder="환자 이름 또는 ID 검색" oninput="filterTable(this.value)">
      </div>
      <select class="filter-select" onchange="filterBySort(this.value)">
        <option value="grade">등급순 (위험 우선)</option>
        <option value="score">건강점수 낮은 순</option>
        <option value="name">이름순</option>
      </select>
    </div>

    <!-- 환자 테이블 -->
    <div class="card">
      <div class="card__body" style="padding:0">
        <div style="overflow-x:auto">
          <table class="patient-table" id="patientTable">
            <thead>
              <tr>
                <th>상태</th>
                <th class="sortable">환자명</th>
                <th>나이/성별</th>
                <th>건강점수</th>
                <th>심박수</th>
                <th>SpO₂</th>
                <th>수면</th>
                <th>스트레스</th>
                <th>추이</th>
                <th>마지막 측정</th>
                <th>검토 상태</th>
                <th>액션</th>
              </tr>
            </thead>
            <tbody id="patientTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

  </main>
</div>

<script src="../assets/js/mock-data.js"></script>
<script>
  const patients = [
    {
      id:'u003', name:'박도현', age:58, gender:'남', grade:'danger', score:51,
      hr:96, spo2:93.2, sleep:4.8, stress:72,
      trend:[65,58,55,51,54,50,51],
      lastMeasured:'2026.04.17 07:15', reviewed:false, isNew:true,
      alert:'야간 SpO₂ 93% 이하 · 심박 96bpm 지속'
    },
    {
      id:'u005', name:'정태현', age:72, gender:'남', grade:'danger', score:48,
      hr:102, spo2:92.5, sleep:5.1, stress:81,
      trend:[60,55,52,50,49,48,48],
      lastMeasured:'2026.04.17 06:48', reviewed:false, isNew:true,
      alert:'심박수 100bpm 초과 · 산소포화도 위험 수준'
    },
    {
      id:'u004', name:'최지우', age:45, gender:'여', grade:'abnormal', score:62,
      hr:88, spo2:95.1, sleep:5.8, stress:61,
      trend:[70,68,65,64,63,62,62],
      lastMeasured:'2026.04.17 07:30', reviewed:true, isNew:false,
      alert:'스트레스 지수 60 초과 · 수면 6시간 미만'
    },
    {
      id:'u001', name:'김민준', age:41, gender:'남', grade:'caution', score:72,
      hr:76, spo2:96.8, sleep:6.8, stress:45,
      trend:[74,72,71,73,70,72,72],
      lastMeasured:'2026.04.17 07:12', reviewed:true, isNew:false,
      alert:'수면 패턴 불규칙 · 오후 스트레스 집중'
    }
  ];

  const gradeConfig = {
    danger:  { label:'위험', bg:'rgba(239,68,68,0.15)',  color:'var(--color-status-danger)', icon:'🚨' },
    abnormal:{ label:'이상', bg:'rgba(249,115,22,0.15)', color:'var(--color-status-abnormal)', icon:'⚠️' },
    caution: { label:'주의', bg:'rgba(245,158,11,0.15)', color:'var(--color-status-caution)', icon:'△' },
    normal:  { label:'정상', bg:'rgba(16,185,129,0.15)', color:'var(--color-status-normal)', icon:'✓' }
  };

  let currentTab = 'all';
  let searchQuery = '';

  function renderSparkline(data, color) {
    const w = 72, h = 28;
    const min = Math.min(...data), max = Math.max(...data);
    const pts = data.map((v,i) => {
      const x = (i/(data.length-1))*(w-4)+2;
      const y = h-2 - ((v-min)/(max-min||1))*(h-4);
      return `${x},${y}`;
    }).join(' ');
    return `<svg class="sparkline-svg" viewBox="0 0 ${w} ${h}">
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>`;
  }

  function renderTable() {
    let list = patients.filter(p => {
      if (currentTab !== 'all' && p.grade !== currentTab) return false;
      if (searchQuery && !p.name.includes(searchQuery) && !p.id.includes(searchQuery)) return false;
      return true;
    });

    document.getElementById('patientTableBody').innerHTML = list.map(p => {
      const g = gradeConfig[p.grade];
      return `
        <tr data-grade="${p.grade}" onclick="window.location='patient-detail.html'">
          <td>
            ${p.isNew ? '<span class="new-dot"></span>' : ''}
            <span class="grade-badge" style="background:${g.bg};color:${g.color}">${g.icon} ${g.label}</span>
          </td>
          <td style="font-weight:var(--font-semibold)">${p.name}</td>
          <td style="color:var(--text-secondary)">${p.age}세 / ${p.gender}</td>
          <td><span style="font-size:var(--text-base);font-weight:var(--font-bold);color:${g.color}">${p.score}</span></td>
          <td class="${p.hr>100?'':''}"><span style="${p.hr>100?'color:var(--color-status-danger);font-weight:600':''}">${p.hr} bpm</span></td>
          <td><span style="${p.spo2<95?'color:var(--color-status-danger);font-weight:600':''}">${p.spo2}%</span></td>
          <td><span style="${p.sleep<6?'color:var(--color-status-caution);font-weight:600':''}">${p.sleep}시간</span></td>
          <td><span style="${p.stress>60?'color:var(--color-status-abnormal);font-weight:600':p.stress>40?'color:var(--color-status-caution)':''}">${p.stress}</span></td>
          <td>${renderSparkline(p.trend, g.color)}</td>
          <td style="font-size:var(--text-xs);color:var(--text-secondary)">${p.lastMeasured}</td>
          <td>
            <span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:100px;
              background:${p.reviewed?'rgba(16,185,129,0.12)':'rgba(239,68,68,0.12)'};
              color:${p.reviewed?'var(--color-status-normal)':'var(--color-status-danger)'}">
              ${p.reviewed ? '검토 완료' : '미검토'}
            </span>
          </td>
          <td>
            <button onclick="event.stopPropagation();window.location='patient-detail.html'"
              style="padding:4px 12px;font-size:11px;font-weight:600;border:1px solid var(--color-primary-400);
              border-radius:4px;background:var(--bg-base);color:var(--color-primary-600);cursor:pointer">
              상세 보기
            </button>
          </td>
        </tr>
        <tr data-grade="${p.grade}" style="background:${p.grade==='danger'?'rgba(239,68,68,0.03)':p.grade==='abnormal'?'rgba(249,115,22,0.03)':'transparent'}">
          <td colspan="12" style="padding:6px 16px 10px;font-size:var(--text-xs);color:var(--text-secondary)">
            <span style="font-weight:600;color:${g.color}">알림 사유:</span> ${p.alert}
          </td>
        </tr>
      `;
    }).join('');
  }

  function switchTab(el, tab) {
    document.querySelectorAll('.list-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    currentTab = tab;
    renderTable();
  }

  function filterTable(q) { searchQuery = q; renderTable(); }
  function filterBySort() { renderTable(); }


  renderTable();

  // 사이드바 접기/펼치기
  function toggleSidebar() {
    const sidebar = document.querySelector('.sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    const isMobile = window.matchMedia('(max-width: 768px)').matches;
    if (isMobile) {
      const isOpen = sidebar.classList.contains('open');
      if (isOpen) {
        sidebar.style.transform = 'translateX(-240px)';
        sidebar.classList.remove('open');
        if (overlay) overlay.classList.remove('visible');
      } else {
        sidebar.style.transform = 'translateX(0)';
        sidebar.style.width = '240px';
        sidebar.classList.add('open');
        if (overlay) overlay.classList.add('visible');
      }
    } else {
      document.body.classList.toggle('sidebar-collapsed');
    }
  }
  function closeMobileSidebar() {
    const sidebar = document.querySelector('.sidebar');
    sidebar.style.transform = 'translateX(-240px)';
    sidebar.classList.remove('open');
    const ov = document.getElementById('sidebar-overlay');
    if (ov) ov.classList.remove('visible');
  }
</script>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeMobileSidebar()"></div>
</body>
</html>

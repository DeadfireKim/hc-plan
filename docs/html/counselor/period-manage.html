<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이용기간 관리 — HC-Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    /* KPI */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-4);
      margin-bottom: var(--space-6);
    }

    .kpi-card {
      background: var(--bg-base);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      text-align: center;
    }

    .kpi-card__val {
      font-size: var(--text-2xl);
      font-weight: var(--font-bold);
      color: var(--text-primary);
    }

    .kpi-card__label {
      font-size: var(--text-xs);
      color: var(--text-secondary);
      margin-top: var(--space-1);
    }

    /* 테이블 */
    .period-table {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--text-sm);
    }

    .period-table th {
      background: var(--color-primary-700);
      color: #fff;
      padding: var(--space-2) var(--space-4);
      text-align: left;
      font-size: var(--text-xs);
      font-weight: var(--font-semibold);
      white-space: nowrap;
    }

    .period-table td {
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--border-default);
      vertical-align: middle;
    }

    .period-table tr:last-child td { border-bottom: none; }
    .period-table tbody tr:hover td { background: var(--bg-surface); }

    /* 기간 바 */
    .period-bar-wrap {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 160px;
    }

    .period-bar {
      flex: 1;
      height: 6px;
      background: var(--bg-muted);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .period-bar__fill {
      height: 100%;
      border-radius: var(--radius-full);
    }

    .period-bar__pct {
      font-size: 10px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    /* 기간 수정 패널 (인라인) */
    .edit-panel {
      background: var(--color-primary-50);
      border: 1px solid var(--color-primary-200);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-top: var(--space-2);
    }

    .edit-panel__title {
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      color: var(--color-primary-700);
      margin-bottom: var(--space-3);
    }

    .edit-row {
      display: flex;
      gap: var(--space-3);
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .edit-group { display: flex; flex-direction: column; gap: var(--space-1); }
    .edit-label { font-size: 10px; font-weight: 600; color: var(--text-secondary); }

    .edit-input {
      padding: var(--space-1) var(--space-2);
      font-size: var(--text-xs);
      border: 1px solid var(--color-primary-300);
      border-radius: var(--radius-sm);
      outline: none;
      color: var(--text-primary);
      background: #fff;
    }

    .edit-input:focus { border-color: var(--color-primary-500); }

    @media (max-width: 1100px) {
      .kpi-row { grid-template-columns: repeat(2, 1fr); }
    }

    /* ── 사이드바 접기/펼치기 ── */
    .sidebar__collapse-btn {
      margin-left: auto;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: var(--radius-sm);
      color: var(--color-primary-400);
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    .sidebar__collapse-btn:hover {
      background: rgba(255,255,255,0.1);
      color: #ffffff;
    }
    body.sidebar-collapsed .sidebar { transform: translateX(-240px); }
    body.sidebar-collapsed .main-header { left: 0; padding-left: 56px; }
    body.sidebar-collapsed .main-content { margin-left: 0; width: 100%; }
    .sidebar      { transition: transform 0.25s ease; }
    .main-header  { transition: left 0.25s ease, padding-left 0.25s ease; }
    .main-content { transition: margin-left 0.25s ease, width 0.25s ease; }
    .sidebar-open-btn {
      display: none;
      position: fixed;
      top: 12px;
      left: 12px;
      width: 36px;
      height: 36px;
      background: var(--color-primary-700);
      border: none;
      border-radius: var(--radius-md);
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #ffffff;
      z-index: 200;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      transition: background 0.15s;
    }
    .sidebar-open-btn:hover { background: var(--color-primary-600); }
    body.sidebar-collapsed .sidebar-open-btn { display: flex; }

    /* 모바일: 사이드바 열기 버튼 항상 표시 */
    @media (max-width: 768px) {
      .sidebar-open-btn { display: flex; }
    }
  </style>
</head>
<body>
<div class="app-shell">

  <nav class="sidebar" id="sidebar">
    <div class="sidebar__logo">
      <div class="sidebar__logo-icon" onclick="location.href='../index.html'" style="cursor:pointer">📞</div>
      <div onclick="location.href='../index.html'" style="cursor:pointer;flex:1">
        <div class="sidebar__logo-text">HC-Plan</div>
        <div class="sidebar__logo-sub">상담사 포털</div>
      </div>
      <div class="sidebar__collapse-btn" onclick="toggleSidebar()" title="사이드바 접기">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
      </div>
    </div>
    <div class="sidebar__nav">
      <div class="sidebar__section-label">상담 관리</div>
      <a href="waiting-list.html" class="sidebar__item">
        <svg class="sidebar__item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        상담 대기 목록
      </a>
      <a href="customer-viewer.html" class="sidebar__item">
        <svg class="sidebar__item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        고객 뷰어
      </a>
      <a href="call-log.html" class="sidebar__item">
        <svg class="sidebar__item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
        통화 기록 작성
      </a>
      <a href="register-user.html" class="sidebar__item">
        <svg class="sidebar__item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
        사용자 대리 등록
      </a>
      <a href="period-manage.html" class="sidebar__item active">
        <svg class="sidebar__item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        이용기간 관리
      </a>
    </div>
    <div class="sidebar__footer">
      <div class="sidebar__user">
        <div class="sidebar__user-avatar">이</div>
        <div class="sidebar__user-info">
          <div class="sidebar__user-name">이수민</div>
          <div class="sidebar__user-role">상담사</div>
        </div>
      </div>
    </div>
  </nav>
  <!-- 사이드바 접혔을 때 열기 버튼 -->
  <button class="sidebar-open-btn" id="sidebar-open-btn" onclick="toggleSidebar()" title="사이드바 열기">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>



  <header class="main-header">
    <div class="main-header__left">
      <div class="main-header__title">이용기간 관리</div>
    </div>
    <div class="main-header__right">
      <button onclick="window.location='register-user.html'"
        style="padding:var(--space-2) var(--space-4);font-size:var(--text-sm);font-weight:600;border:none;border-radius:var(--radius-md);background:var(--color-primary-600);color:#fff;cursor:pointer">
        + 사용자 등록
      </button>
    </div>
  </header>

  <main class="main-content">

    <!-- KPI -->
    <div class="kpi-row">
      <div class="kpi-card">
        <div class="kpi-card__val">4</div>
        <div class="kpi-card__label">담당 사용자</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-card__val" style="color:var(--color-status-danger)">2</div>
        <div class="kpi-card__label">7일 내 만료</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-card__val" style="color:var(--color-status-caution)">1</div>
        <div class="kpi-card__label">30일 내 만료</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-card__val" style="color:var(--color-status-normal)">1</div>
        <div class="kpi-card__label">활성 정상</div>
      </div>
    </div>

    <!-- 필터 -->
    <div style="display:flex;gap:var(--space-3);margin-bottom:var(--space-4);flex-wrap:wrap">
      <div style="flex:1;min-width:180px;position:relative">
        <svg width="14" height="14" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-secondary)" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="이름 또는 ID 검색"
          style="width:100%;padding:8px 12px 8px 30px;font-size:var(--text-sm);border:1px solid var(--border-strong);border-radius:var(--radius-md);outline:none">
      </div>
      <select style="padding:var(--space-2) var(--space-3);font-size:var(--text-sm);border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--bg-base)">
        <option>전체 상태</option>
        <option>만료 임박 (7일)</option>
        <option>활성</option>
        <option>만료됨</option>
      </select>
      <select style="padding:var(--space-2) var(--space-3);font-size:var(--text-sm);border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--bg-base)">
        <option>전체 플랜</option>
        <option>Demo</option>
        <option>Basic</option>
        <option>Standard</option>
      </select>
    </div>

    <!-- 이용기간 테이블 -->
    <div class="card">
      <div class="card__body" style="padding:0">
        <div style="overflow-x:auto">
          <table class="period-table">
            <thead>
              <tr>
                <th>사용자</th>
                <th>플랜</th>
                <th>시작일</th>
                <th>만료일</th>
                <th>잔여</th>
                <th>이용률</th>
                <th>건강 상태</th>
                <th>액션</th>
              </tr>
            </thead>
            <tbody id="periodTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 기간 수정 패널 -->
    <div class="edit-panel" id="editPanel" style="display:none">
      <div class="edit-panel__title">이용기간 수정 — <span id="editName"></span></div>
      <div class="edit-row">
        <div class="edit-group">
          <div class="edit-label">시작일</div>
          <input class="edit-input" type="date" id="editStart">
        </div>
        <div class="edit-group">
          <div class="edit-label">만료일</div>
          <input class="edit-input" type="date" id="editEnd">
        </div>
        <div class="edit-group">
          <div class="edit-label">플랜 변경</div>
          <select class="edit-input" style="padding:4px 8px">
            <option>Demo (30일)</option>
            <option>Basic (90일)</option>
            <option>Standard (180일)</option>
            <option>Premium (365일)</option>
          </select>
        </div>
        <div class="edit-group">
          <div class="edit-label">연장 (일수)</div>
          <input class="edit-input" type="number" value="30" min="1" max="365" style="width:70px">
        </div>
        <div style="display:flex;gap:var(--space-2)">
          <button onclick="saveEdit()"
            style="padding:5px 14px;font-size:var(--text-xs);font-weight:600;border:none;border-radius:4px;background:var(--color-primary-600);color:#fff;cursor:pointer">
            저장
          </button>
          <button onclick="closeEdit()"
            style="padding:5px 14px;font-size:var(--text-xs);border:1px solid var(--border-strong);border-radius:4px;background:var(--bg-base);cursor:pointer">
            취소
          </button>
        </div>
      </div>
      <div style="margin-top:var(--space-3)">
        <div class="edit-label" style="margin-bottom:4px">변경 사유 (내부 메모)</div>
        <input type="text" class="edit-input" style="width:100%" placeholder="이용기간 변경 사유를 입력하세요">
      </div>
    </div>

  </main>
</div>

<script>
  const users = [
    { id:'u005', name:'정태현', age:'72세/남', plan:'Demo', start:'2026.03.25', end:'2026.04.25', total:30, used:24, grade:'danger' },
    { id:'u002', name:'이서연', age:'35세/여', plan:'Demo', start:'2026.04.01', end:'2026.04.30', total:30, used:17, grade:'normal' },
    { id:'u003', name:'박도현', age:'58세/남', plan:'Demo', start:'2026.04.02', end:'2026.05.01', total:30, used:16, grade:'danger' },
    { id:'u001', name:'김민준', age:'41세/남', plan:'Demo', start:'2026.04.17', end:'2026.05.17', total:30, used:1, grade:'caution' }
  ];

  const gradeColor = { danger:'var(--color-status-danger)', caution:'var(--color-status-caution)', normal:'var(--color-status-normal)' };
  const gradeLabel = { danger:'위험', caution:'주의', normal:'정상' };
  const gradeBg    = { danger:'rgba(239,68,68,0.12)', caution:'rgba(245,158,11,0.12)', normal:'rgba(16,185,129,0.12)' };

  function daysLeft(endStr) {
    const [y,m,d] = endStr.split('.').map(Number);
    const end = new Date(y, m-1, d);
    const now = new Date();
    now.setHours(0,0,0,0);
    return Math.max(0, Math.round((end-now)/(1000*60*60*24)));
  }

  function barColor(left) {
    return left <= 7 ? '#ef4444' : left <= 14 ? '#f59e0b' : '#10b981';
  }

  function renderTable() {
    document.getElementById('periodTableBody').innerHTML = users.map(u => {
      const left = daysLeft(u.end);
      const pct = Math.round((u.used / u.total) * 100);
      const urgent = left <= 7;
      return `
        <tr>
          <td>
            <div style="font-weight:var(--font-semibold)">${u.name}</div>
            <div style="font-size:10px;color:var(--text-secondary)">${u.age} · ${u.id}</div>
          </td>
          <td>
            <span style="font-size:11px;padding:2px 8px;border-radius:100px;background:var(--bg-muted);color:var(--text-secondary)">${u.plan}</span>
          </td>
          <td style="font-size:var(--text-xs);color:var(--text-secondary)">${u.start}</td>
          <td style="font-size:var(--text-xs);${urgent?'font-weight:600;color:var(--color-status-danger)':'color:var(--text-secondary)'}">${u.end}</td>
          <td>
            <span style="font-size:var(--text-sm);font-weight:600;color:${barColor(left)}">${left}일</span>
          </td>
          <td>
            <div class="period-bar-wrap">
              <div class="period-bar">
                <div class="period-bar__fill" style="width:${pct}%;background:${barColor(left)}"></div>
              </div>
              <span class="period-bar__pct">${pct}%</span>
            </div>
          </td>
          <td>
            <span style="font-size:10px;font-weight:600;padding:2px 7px;border-radius:100px;background:${gradeBg[u.grade]};color:${gradeColor[u.grade]}">
              ${gradeLabel[u.grade]}
            </span>
          </td>
          <td>
            <div style="display:flex;gap:var(--space-2)">
              <button onclick="openEdit('${u.id}','${u.name}','${u.start}','${u.end}')"
                style="padding:3px 10px;font-size:11px;font-weight:600;border:1px solid var(--color-primary-400);border-radius:4px;background:var(--bg-base);color:var(--color-primary-600);cursor:pointer">
                기간 수정
              </button>
              <button onclick="window.location='customer-viewer.html'"
                style="padding:3px 10px;font-size:11px;border:1px solid var(--border-strong);border-radius:4px;background:var(--bg-base);cursor:pointer">
                보기
              </button>
            </div>
          </td>
        </tr>
      `;
    }).join('');
  }

  function openEdit(id, name, start, end) {
    document.getElementById('editPanel').style.display = '';
    document.getElementById('editName').textContent = name;
    const toISO = s => s.split('.').join('-');
    document.getElementById('editStart').value = toISO(start);
    document.getElementById('editEnd').value = toISO(end);
    document.getElementById('editPanel').scrollIntoView({ behavior:'smooth', block:'nearest' });
  }

  function saveEdit() {
    alert('이용기간이 수정되었습니다.');
    closeEdit();
  }

  function closeEdit() {
    document.getElementById('editPanel').style.display = 'none';
  }


  renderTable();

  // 사이드바 접기/펼치기
  function toggleSidebar() {
    const sidebar = document.querySelector('.sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    const isMobile = window.matchMedia('(max-width: 768px)').matches;
    if (isMobile) {
      const isOpen = sidebar.classList.contains('open');
      if (isOpen) {
        sidebar.style.transform = 'translateX(-240px)';
        sidebar.classList.remove('open');
        if (overlay) overlay.classList.remove('visible');
      } else {
        sidebar.style.transform = 'translateX(0)';
        sidebar.style.width = '240px';
        sidebar.classList.add('open');
        if (overlay) overlay.classList.add('visible');
      }
    } else {
      document.body.classList.toggle('sidebar-collapsed');
    }
  }
  function closeMobileSidebar() {
    const sidebar = document.querySelector('.sidebar');
    sidebar.style.transform = 'translateX(-240px)';
    sidebar.classList.remove('open');
    const ov = document.getElementById('sidebar-overlay');
    if (ov) ov.classList.remove('visible');
  }
</script>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeMobileSidebar()"></div>
</body>
</html>

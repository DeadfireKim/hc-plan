<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 — HC-Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <style>
    body {
      min-height: 100vh;
      background: var(--bg-surface);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: var(--space-8) var(--space-4);
    }

    .register-wrap {
      width: 100%;
      max-width: 560px;
    }

    .register-header {
      text-align: center;
      margin-bottom: var(--space-8);
    }

    .register-header__logo {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-4);
      color: var(--color-primary-700);
      font-size: var(--text-lg);
      font-weight: var(--font-bold);
    }

    .register-header__title {
      font-size: var(--text-2xl);
      font-weight: var(--font-bold);
      color: var(--text-primary);
      margin-bottom: var(--space-1);
    }

    .register-header__desc {
      font-size: var(--text-sm);
      color: var(--text-secondary);
    }

    /* 단계 표시기 */
    .steps-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      margin-bottom: var(--space-8);
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: var(--text-xs);
      color: var(--text-secondary);
    }

    .step-item__num {
      width: 24px;
      height: 24px;
      border-radius: var(--radius-full);
      background: var(--bg-muted);
      border: 1.5px solid var(--border-default);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--text-xs);
      font-weight: var(--font-semibold);
      color: var(--text-secondary);
    }

    .step-item.active .step-item__num {
      background: var(--color-primary-600);
      border-color: var(--color-primary-600);
      color: #ffffff;
    }

    .step-item.done .step-item__num {
      background: var(--color-primary-100);
      border-color: var(--color-primary-400);
      color: var(--color-primary-600);
    }

    .step-item.active { color: var(--text-primary); font-weight: var(--font-medium); }

    .step-divider {
      width: 40px;
      height: 1px;
      background: var(--border-default);
      margin: 0 var(--space-2);
    }

    /* 폼 카드 */
    .register-card {
      background: var(--bg-base);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl);
      padding: var(--space-8);
      box-shadow: var(--shadow-md);
    }

    .register-card__section {
      margin-bottom: var(--space-6);
    }

    .register-card__section-title {
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      color: var(--color-primary-700);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: var(--space-4);
      padding-bottom: var(--space-2);
      border-bottom: 1px solid var(--border-default);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-4);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    .form-group--full {
      grid-column: span 2;
    }

    .form-label {
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      color: var(--text-primary);
    }

    .form-label--required::after {
      content: ' *';
      color: var(--color-status-danger);
    }

    .form-input,
    .form-select {
      width: 100%;
      padding: var(--space-2) var(--space-3);
      font-size: var(--text-sm);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      outline: none;
      color: var(--text-primary);
      background: var(--bg-base);
      transition: border-color var(--transition-fast),
                  box-shadow var(--transition-fast);
    }

    .form-input:focus,
    .form-select:focus {
      border-color: var(--color-primary-500);
      box-shadow: 0 0 0 3px var(--color-primary-100);
    }

    .form-input-unit {
      display: flex;
      align-items: center;
      gap: 0;
    }

    .form-input-unit .form-input {
      border-radius: var(--radius-md) 0 0 var(--radius-md);
      border-right: none;
    }

    .form-input-unit__suffix {
      padding: var(--space-2) var(--space-3);
      background: var(--bg-muted);
      border: 1px solid var(--border-strong);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      font-size: var(--text-sm);
      color: var(--text-secondary);
      white-space: nowrap;
    }

    /* 성별 라디오 */
    .gender-group {
      display: flex;
      gap: var(--space-3);
    }

    .gender-option {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: var(--text-sm);
      color: var(--text-secondary);
      transition: border-color var(--transition-fast),
                  color var(--transition-fast),
                  background-color var(--transition-fast);
    }

    .gender-option input[type="radio"] { display: none; }

    .gender-option:has(input:checked) {
      border-color: var(--color-primary-500);
      background-color: var(--color-primary-50);
      color: var(--color-primary-700);
      font-weight: var(--font-medium);
    }

    /* 플랜 안내 */
    .plan-notice {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
      padding: var(--space-4);
      background: var(--color-primary-50);
      border: 1px solid var(--color-primary-100);
      border-radius: var(--radius-lg);
      margin-top: var(--space-2);
    }

    .plan-notice__icon { font-size: 20px; flex-shrink: 0; }

    .plan-notice__title {
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      color: var(--color-primary-700);
      margin-bottom: var(--space-1);
    }

    .plan-notice__desc {
      font-size: var(--text-xs);
      color: var(--color-primary-600);
      line-height: 1.6;
    }

    /* 제출 버튼 */
    .register-footer {
      margin-top: var(--space-6);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .btn-register {
      width: 100%;
      padding: var(--space-3);
      background-color: var(--color-primary-600);
      color: #ffffff;
      font-size: var(--text-base);
      font-weight: var(--font-semibold);
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      transition: background-color var(--transition-fast);
    }

    .btn-register:hover { background-color: var(--color-primary-700); }

    .register-footer__login {
      text-align: center;
      font-size: var(--text-xs);
      color: var(--text-secondary);
    }

    .register-footer__login a {
      color: var(--color-primary-600);
      font-weight: var(--font-medium);
    }

    @media (max-width: 480px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-group--full { grid-column: span 1; }
    }
  </style>
</head>
<body>

  <div class="register-wrap">

    <div class="register-header">
      <div class="register-header__logo">❤ HC-Plan</div>
      <h1 class="register-header__title">회원가입</h1>
      <p class="register-header__desc">건강 모니터링 서비스를 시작하세요</p>
    </div>

    <div class="steps-indicator">
      <div class="step-item active">
        <div class="step-item__num">1</div>
        기본 정보
      </div>
      <div class="step-divider"></div>
      <div class="step-item">
        <div class="step-item__num">2</div>
        앱 연동
      </div>
      <div class="step-divider"></div>
      <div class="step-item">
        <div class="step-item__num">3</div>
        완료
      </div>
    </div>

    <div class="register-card">

      <!-- 계정 정보 -->
      <div class="register-card__section">
        <div class="register-card__section-title">계정 정보</div>
        <div class="form-grid">
          <div class="form-group form-group--full">
            <label class="form-label form-label--required" for="name">이름</label>
            <input class="form-input" type="text" id="name" placeholder="실명을 입력하세요">
          </div>
          <div class="form-group form-group--full">
            <label class="form-label form-label--required" for="email">이메일</label>
            <input class="form-input" type="email" id="email" placeholder="로그인 시 사용됩니다">
          </div>
          <div class="form-group">
            <label class="form-label form-label--required" for="pw">비밀번호</label>
            <input class="form-input" type="password" id="pw" placeholder="8자 이상">
          </div>
          <div class="form-group">
            <label class="form-label form-label--required" for="pw2">비밀번호 확인</label>
            <input class="form-input" type="password" id="pw2" placeholder="비밀번호 재입력">
          </div>
          <div class="form-group form-group--full">
            <label class="form-label form-label--required" for="phone">핸드폰번호</label>
            <input class="form-input" type="tel" id="phone" placeholder="010-0000-0000">
          </div>
        </div>
      </div>

      <!-- 건강 정보 (AI 분석 기준값) -->
      <div class="register-card__section">
        <div class="register-card__section-title">건강 기본 정보 (AI 분석 기준)</div>
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label form-label--required" for="birth">출생년도</label>
            <input class="form-input" type="number" id="birth"
              placeholder="예: 1980" min="1920" max="2010">
          </div>
          <div class="form-group">
            <label class="form-label form-label--required">성별</label>
            <div class="gender-group">
              <label class="gender-option">
                <input type="radio" name="gender" value="male" checked>
                남성
              </label>
              <label class="gender-option">
                <input type="radio" name="gender" value="female">
                여성
              </label>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label form-label--required" for="height">키</label>
            <div class="form-input-unit">
              <input class="form-input" type="number" id="height"
                placeholder="170" min="100" max="250">
              <span class="form-input-unit__suffix">cm</span>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label form-label--required" for="weight">몸무게</label>
            <div class="form-input-unit">
              <input class="form-input" type="number" id="weight"
                placeholder="70" min="20" max="200">
              <span class="form-input-unit__suffix">kg</span>
            </div>
          </div>
        </div>
        <p style="margin-top:var(--space-2);font-size:var(--text-xs);color:var(--text-secondary);">
          * 키, 몸무게, 출생년도, 성별은 AI 건강 분석의 표준치 기준으로 사용됩니다.
        </p>
      </div>

      <!-- 서비스 플랜 -->
      <div class="register-card__section">
        <div class="register-card__section-title">서비스 플랜</div>
        <div class="plan-notice">
          <div class="plan-notice__icon">🎁</div>
          <div>
            <div class="plan-notice__title">30일 무료 Demo 플랜으로 시작합니다</div>
            <div class="plan-notice__desc">
              가입 후 30일간 모든 서비스를 무료로 이용하실 수 있습니다.<br>
              이용 기간은 담당 상담사가 별도 안내드립니다.
            </div>
          </div>
        </div>
      </div>

    </div>

    <div class="register-footer">
      <button class="btn-register" onclick="handleRegister()">
        가입하고 시작하기
      </button>
      <div class="register-footer__login">
        이미 계정이 있으신가요? <a href="login.html">로그인</a>
      </div>
    </div>

  </div>

  <script>
    function handleRegister() {
      window.location.href = 'user/qr.html';
    }
  </script>

</body>
</html>

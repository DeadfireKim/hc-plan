<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>긴급 도움 · 시니어 앱 — 서울본병원</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" />
  <link rel="stylesheet" href="../assets/app.css" />
</head>
<body>
  <div class="m-frame">
    <header class="m-appbar">
      <a class="m-back" href="./home.html" title="뒤로">←</a>
      <span class="m-title">긴급 도움</span>
    </header>

    <main class="m-body">
      <!-- 큰 SOS -->
      <div style="text-align:center; margin:18px 0 24px">
        <button class="m-sos-big" onclick="this.nextElementSibling.style.display='block'">
          🆘<br>긴급 호출
        </button>
        <div style="display:none; margin-top:16px; padding:14px; background:var(--color-danger-subtle); border-radius:14px; font-size:15px; font-weight:700; color:var(--color-danger)">
          보호자와 119에 연락 중입니다…<br>현재 위치가 함께 전송됩니다.
        </div>
      </div>

      <div style="font-size:14px; color:var(--color-text-secondary); text-align:center; margin-bottom:20px; line-height:1.6">
        버튼을 누르면 <b>보호자 전원과 119</b>에 자동으로 연락되고,<br>지금 위치가 함께 공유됩니다.
      </div>

      <!-- 원터치 연락 -->
      <div class="m-card-title" style="margin-bottom:10px">바로 연락하기</div>
      <a class="m-call" href="tel:119">
        <span class="m-call-ico" style="background:var(--color-danger-subtle)">🚑</span>
        <div><div class="m-list-main">119 구급대</div><div class="m-list-sub">응급 신고</div></div>
        <span class="m-call-go">📞</span>
      </a>
      <a class="m-call" href="tel:01012345678">
        <span class="m-call-ico" style="background:var(--color-primary-subtle)">👨‍👩‍👧</span>
        <div><div class="m-list-main">이민준 (자녀)</div><div class="m-list-sub">보호자 · 010-1234-5678</div></div>
        <span class="m-call-go">📞</span>
      </a>
      <a class="m-call" href="tel:0233334444">
        <span class="m-call-ico" style="background:var(--color-success-subtle)">🩺</span>
        <div><div class="m-list-main">이정민 선생님</div><div class="m-list-sub">주치의 · 서울본병원 내과</div></div>
        <span class="m-call-go">📞</span>
      </a>

      <div class="m-status warn" style="margin-top:18px">
        <span class="m-status-ico">🛡️</span>
        <div>
          <div class="m-status-txt" style="font-size:15px">낙상 자동 감지 켜짐</div>
          <div class="m-status-sub">넘어짐이 감지되고 30초간 반응이 없으면 자동으로 도움을 요청해요.</div>
        </div>
      </div>
    </main>
  </div>

  <style>
    .m-sos-big { width:180px; height:180px; border:none; border-radius:50%; background:var(--color-danger); color:#fff; font-size:24px; font-weight:800; line-height:1.3; font-family:inherit; cursor:pointer; box-shadow:0 8px 24px rgba(194,85,77,.4); }
    .m-call { display:flex; align-items:center; gap:14px; background:var(--color-surface); border-radius:14px; padding:14px 16px; margin-bottom:12px; box-shadow:var(--shadow-card); text-decoration:none; color:var(--color-text); }
    .m-call-ico { width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0; }
    .m-call-go { margin-left:auto; font-size:20px; }
  </style>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>일정 · 시니어 앱 — 서울본병원</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" />
  <link rel="stylesheet" href="../assets/app.css" />
</head>
<body>
  <div class="m-frame">
    <header class="m-appbar">
      <a class="m-brand" href="../index.html" title="데모 허브로 이동">서울본병원</a>
      <a class="m-bell" href="./notifications.html" title="알림">🔔<span class="dot-red"></span></a>
    </header>

    <main class="m-body">
      <div class="m-greet" style="font-size:20px; margin-bottom:4px">일정</div>
      <div class="m-greet-sub" style="margin-bottom:14px">다가오는 일정 4건</div>
      <div class="m-toggle" id="mViewToggle"><button class="active" data-mode="simple">간단히</button><button data-mode="detail">자세히</button></div>

      <a class="m-btn m-btn-line" onclick="openModal('scheduleModal')" style="margin-bottom:16px; cursor:pointer">＋ 일정 추가</a>

      <!-- 오늘 -->
      <div class="m-card">
        <div class="m-list-row" style="padding-top:0">
          <div>
            <div style="margin-bottom:4px"><span class="badge badge-blue">병원 예약</span></div>
            <div class="m-list-main">내과 진료</div>
            <div class="m-list-sub">오늘 오후 2시 · 서울본병원 이정민 선생님</div>
            <div class="m-list-sub detail-only">📍 본관 3층 내과 접수 · 진료카드·약봉투 지참</div>
          </div>
          <span class="m-list-right badge badge-red">오늘</span>
        </div>
      </div>

      <!-- 다가오는 -->
      <div class="m-card">
        <div class="m-list-row">
          <div>
            <div style="margin-bottom:4px"><span class="badge badge-blue">검진</span></div>
            <div class="m-list-main">정기 건강검진</div>
            <div class="m-list-sub">5월 23일 금요일 오전 10시 · 서울본병원</div>
          </div>
          <span class="m-list-right badge badge-amber">D-3</span>
        </div>
        <div class="m-list-row">
          <div>
            <div style="margin-bottom:4px"><span class="badge badge-green">운동</span></div>
            <div class="m-list-main">아침 산책</div>
            <div class="m-list-sub">매일 오전 7시 · 30분</div>
          </div>
          <span class="m-list-right badge badge-gray">반복</span>
        </div>
        <div class="m-list-row">
          <div>
            <div style="margin-bottom:4px"><span class="badge badge-gray">기타</span></div>
            <div class="m-list-main">경로당 모임</div>
            <div class="m-list-sub">5월 28일 수요일 오후 3시</div>
          </div>
          <span class="m-list-right badge badge-gray">D-8</span>
        </div>
      </div>

      <div style="font-size:12px; color:var(--color-text-muted); text-align:center; margin-top:4px">
        병원 예약은 3일 전·1일 전·당일에 알려드려요
      </div>
    </main>

    <nav class="m-tabbar">
      <a href="./home.html"><span class="m-tab-ico">🏠</span>홈</a>
      <a href="./trend.html"><span class="m-tab-ico">📈</span>건강추이</a>
      <a href="./medication.html"><span class="m-tab-ico">💊</span>복약</a>
      <a class="active" href="./schedule.html"><span class="m-tab-ico">📅</span>일정</a>
      <a href="./settings.html"><span class="m-tab-ico">⚙️</span>설정</a>
    </nav>
  </div>

  <!-- 일정 추가 모달 (M) -->
  <div class="overlay hidden m-sheet" id="scheduleModal">
    <div class="modal modal-sm">
      <div class="modal-header">
        <span class="modal-title">일정 추가</span>
        <button class="modal-close" onclick="closeModal('scheduleModal')">✕</button>
      </div>
      <div class="modal-body">
        <table class="form-table">
          <tbody>
            <tr><th>유형 <span class="required">*</span></th><td><select class="select"><option>병원 예약</option><option>검진</option><option>운동</option><option>기타</option></select></td></tr>
            <tr><th>제목 <span class="required">*</span></th><td><input class="input" placeholder="일정 제목" /></td></tr>
            <tr><th>반복</th><td><select class="select" id="repeatSel" onchange="toggleRepeat()"><option>반복 안 함</option><option>매일</option><option>매주</option><option>매월</option></select></td></tr>
            <tr id="rowOnce"><th>일시 <span class="required">*</span></th><td><input class="input" type="datetime-local" /></td></tr>
            <tr id="rowWeekly" class="hidden"><th>반복 요일 <span class="required">*</span></th><td><div style="display:flex; gap:10px; flex-wrap:wrap">
              <label class="checkbox-label"><input type="checkbox" /> 월</label>
              <label class="checkbox-label"><input type="checkbox" /> 화</label>
              <label class="checkbox-label"><input type="checkbox" /> 수</label>
              <label class="checkbox-label"><input type="checkbox" /> 목</label>
              <label class="checkbox-label"><input type="checkbox" /> 금</label>
              <label class="checkbox-label"><input type="checkbox" /> 토</label>
              <label class="checkbox-label"><input type="checkbox" /> 일</label>
            </div></td></tr>
            <tr id="rowMonthly" class="hidden"><th>반복 일자 <span class="required">*</span></th><td><select class="select"><option>매월 1일</option><option>매월 5일</option><option>매월 10일</option><option>매월 15일</option><option>매월 20일</option><option>매월 25일</option><option>매월 말일</option></select></td></tr>
            <tr id="rowTime" class="hidden"><th>시간 <span class="required">*</span></th><td><input class="input" type="time" /></td></tr>
            <tr><th>장소</th><td><input class="input" placeholder="장소(선택)" /></td></tr>
            <tr><th>메모</th><td><textarea class="textarea" placeholder="메모(선택)"></textarea></td></tr>
          </tbody>
        </table>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-md" onclick="closeModal('scheduleModal')">취소</button>
        <button class="btn btn-primary btn-md">저장</button>
      </div>
    </div>
  </div>

  <script src="../assets/modal.js"></script>
  <script src="../assets/textarea-autogrow.js"></script>
  <script src="../assets/mobile-view.js"></script>
  <script>
    // 반복 선택에 따라 입력 필드 전환: 반복 안 함=일시 / 매일=시간 / 매주=요일+시간 / 매월=일자+시간
    function toggleRepeat() {
      var v = document.getElementById('repeatSel').value;
      document.getElementById('rowOnce').classList.toggle('hidden', v !== '반복 안 함');
      document.getElementById('rowWeekly').classList.toggle('hidden', v !== '매주');
      document.getElementById('rowMonthly').classList.toggle('hidden', v !== '매월');
      document.getElementById('rowTime').classList.toggle('hidden', v === '반복 안 함');
    }
  </script>
</body>
</html>

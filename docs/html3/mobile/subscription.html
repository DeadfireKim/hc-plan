<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>구독 관리 · 앱 — 서울본병원</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" />
  <link rel="stylesheet" href="../assets/app.css" />
</head>
<body>
  <div class="m-frame">
    <header class="m-appbar">
      <a class="m-back" href="./settings.html" title="뒤로">←</a>
      <span class="m-title">구독 관리</span>
    </header>

    <main class="m-body">
      <!-- 현재 구독 -->
      <div class="m-card" style="background:var(--color-primary-subtle)">
        <div class="m-list-sub">현재 이용 중</div>
        <div style="font-size:22px; font-weight:800; margin:4px 0">스탠다드</div>
        <div class="m-list-sub">다음 결제일 2026-06-12 · 월 19,900원</div>
      </div>

      <div class="m-card-title" style="margin:6px 0 10px">플랜 선택</div>

      <!-- 5단계 플랜 -->
      <div class="m-plan">
        <div class="m-plan-head"><span class="m-plan-name">무료 체험</span><span class="m-plan-price">0원</span></div>
        <div class="m-plan-feat">와치 연동 · 기본 건강 기록</div>
      </div>
      <div class="m-plan">
        <div class="m-plan-head"><span class="m-plan-name">베이직</span><span class="m-plan-price">9,900원<small>/월</small></span></div>
        <div class="m-plan-feat">+ 이상 알림 · 보호자 연결</div>
      </div>
      <div class="m-plan current">
        <div class="m-plan-head"><span class="m-plan-name">스탠다드 <span class="badge badge-green">이용 중</span></span><span class="m-plan-price">19,900원<small>/월</small></span></div>
        <div class="m-plan-feat">+ 월간 레포트 · 복약/일정 관리</div>
      </div>
      <div class="m-plan">
        <div class="m-plan-head"><span class="m-plan-name">프리미엄</span><span class="m-plan-price">39,900원<small>/월</small></span></div>
        <div class="m-plan-feat">+ 의료진 직접 상담 · 우선 알림</div>
      </div>
      <div class="m-plan vip">
        <div class="m-plan-head"><span class="m-plan-name">VIP 컨시어지</span><span class="m-plan-price">문의</span></div>
        <div class="m-plan-feat">+ 전국 병원 예약 대행 · 전담 케어매니저</div>
        <a class="m-card-more" href="./concierge.html">컨시어지 보기 →</a>
      </div>

      <button class="m-btn m-btn-primary" style="margin-top:8px">플랜 변경</button>
      <div style="font-size:12px; color:var(--color-text-muted); text-align:center; margin-top:10px">
        ※ 구독 단계·가격은 확정 전 예시입니다 (요건 D-05)
      </div>
    </main>
  </div>

  <style>
    .m-plan { background:var(--color-surface); border:1.5px solid var(--color-border); border-radius:14px; padding:16px; margin-bottom:12px; box-shadow:var(--shadow-card); }
    .m-plan.current { border-color:var(--color-primary); }
    .m-plan.vip { border-color:var(--color-gnb-accent); background:#fdfaf0; }
    .m-plan-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
    .m-plan-name { font-size:16px; font-weight:800; }
    .m-plan-price { font-size:16px; font-weight:700; color:var(--color-primary); }
    .m-plan-price small { font-size:12px; color:var(--color-text-muted); font-weight:500; }
    .m-plan-feat { font-size:13px; color:var(--color-text-secondary); }
  </style>
</body>
</html>

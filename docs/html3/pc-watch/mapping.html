<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>의료진·시니어 매핑 · 와치관리자 — HealthCare Watch</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" />
  <link rel="stylesheet" href="../assets/app.css" />
</head>
<body>
  <div class="shell">
    <!-- ===== GNB ===== -->
    <header class="gnb">
      <a class="gnb-logo" href="../index.html" title="데모 허브로 이동">
        <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
          <rect width="30" height="30" rx="8" fill="#d4af37" />
          <path d="M4 15 h5 l2.2 -6 l3.4 12 l2.4 -6 H26" fill="none" stroke="#1f3a36" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        서울본병원
      </a>
      <nav class="gnb-menu">
        <a class="gnb-item" href="../pc-admin/dashboard.html">관리자 포털</a>
        <a class="gnb-item active" href="./dashboard.html">와치관리자 포털</a>
        <a class="gnb-item" href="../pc-doctor/dashboard.html">의료진 포털</a>
      </nav>
      <div class="gnb-user">
        <button class="gnb-user-btn" onclick="document.getElementById('um').classList.toggle('hidden')">
          <span class="gnb-avatar">김</span> 김선숙
        </button>
        <div class="user-menu hidden" id="um">
          <button class="user-menu-item">로그아웃</button>
        </div>
      </div>
    </header>

    <div class="shell-body">
      <!-- ===== LNB ===== -->
      <aside class="lnb">
        <div class="lnb-header">
          <button class="lnb-toggle" onclick="document.querySelector('.lnb').classList.toggle('collapsed')">☰</button>
          <span class="lnb-title">와치관리자</span>
        </div>
        <nav class="lnb-nav">
          <a class="lnb-link" href="./dashboard.html">대시보드 <span class="lnb-type-badge">S</span></a>
          <a class="lnb-link" href="./seniors.html">시니어 관리 <span class="lnb-type-badge">L</span></a>
          <a class="lnb-link" href="./medicals.html">의료진 관리 <span class="lnb-type-badge">L</span></a>
          <a class="lnb-link active" href="./mapping.html">의료진·시니어 매핑 <span class="lnb-type-badge">P-MAP</span></a>
          <a class="lnb-link" href="./devices.html">기기 관리 <span class="lnb-type-badge">L</span></a>
          <a class="lnb-link" href="./notice.html">공지사항 <span class="lnb-type-badge">L</span></a>
        </nav>
      </aside>

      <!-- ===== 콘텐츠 (P-MAP: 좌 시니어 / 우 담당 의료진) ===== -->
      <main class="shell-content">
        <div class="shell-content-inner">
          <div class="page-header">
            <div class="page-header-text">
              <h1 class="page-title">의료진·시니어 매핑 <span class="badge badge-blue type-tag">P-MAP</span></h1>
              <p class="page-desc">시니어별 담당 의료진 지정</p>
            </div>
          </div>

          <div class="map-layout">
            <!-- 좌: 시니어 목록 -->
            <div class="map-panel">
              <div class="map-panel-head">시니어 (128)</div>
              <div class="map-search" style="display:flex; align-items:center; gap:var(--space-3)">
                <input id="snrSearch" class="input" placeholder="시니어 이름 검색" oninput="filterSeniors()" style="flex:1" />
                <label class="checkbox-label" style="flex-shrink:0; white-space:nowrap; font-size:var(--font-size-sm); color:var(--color-text-secondary)">
                  <input type="checkbox" id="snrUnassigned" onchange="filterSeniors()" /> 담당자 미배정만
                </label>
              </div>
              <div class="map-list">
                <div class="map-item active" data-name="김순자" data-count="2" onclick="pick(this)">김순자<span class="map-sub">담당 2명</span></div>
                <div class="map-item" data-name="박영호" data-count="1" onclick="pick(this)">박영호<span class="map-sub">담당 1명</span></div>
                <div class="map-item" data-name="오삼순" data-count="2" onclick="pick(this)">오삼순<span class="map-sub">담당 2명</span></div>
                <div class="map-item" data-name="이말순" data-count="2" onclick="pick(this)">이말순<span class="map-sub">담당 2명</span></div>
                <div class="map-item" data-name="정복동" data-count="0" onclick="pick(this)">정복동<span class="map-sub" style="color:var(--color-danger); font-weight:600">미배정</span></div>
                <div class="map-item" data-name="최금자" data-count="2" onclick="pick(this)">최금자<span class="map-sub">담당 2명</span></div>
                <div class="map-item" data-name="한정식" data-count="1" onclick="pick(this)">한정식<span class="map-sub">담당 1명</span></div>
              </div>
            </div>

            <!-- 우: 선택 시니어의 담당 의료진 -->
            <div class="map-panel">
              <div class="map-panel-head">김순자 님의 담당 의료진 <span class="badge badge-green" style="margin-left:auto">2명 지정</span></div>
              <div class="map-add">
                <select class="select" style="flex:1">
                  <option>의료진 선택</option>
                  <option>김미영 (간호사 · 가정의학과)</option>
                  <option>정한솔 (의사 · 순환기내과)</option>
                  <option>최동훈 (의사 · 가정의학과)</option>
                </select>
                <button class="btn btn-primary btn-md">지정</button>
              </div>
              <div class="map-list">
                <div class="map-mapped">
                  이정민 <span class="badge badge-blue">의사</span> · 내과
                  <button class="btn btn-danger btn-sm map-rm">해제</button>
                </div>
                <div class="map-mapped">
                  박서연 <span class="badge badge-green">간호사</span> · 내과
                  <button class="btn btn-danger btn-sm map-rm">해제</button>
                </div>
              </div>
            </div>
          </div>

          <!-- 저장 -->
          <div style="display:flex; justify-content:center; gap:var(--space-2); margin:var(--space-4) 0;">
            <button class="btn btn-primary btn-md">저장</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <style>.hidden{display:none}</style>
  <script>
    function filterSeniors() {
      var kw = document.getElementById('snrSearch').value.trim();
      var onlyUnassigned = document.getElementById('snrUnassigned').checked;
      document.querySelectorAll('.map-item').forEach(function (it) {
        var nameMatch = !kw || it.dataset.name.indexOf(kw) !== -1;
        var assignMatch = !onlyUnassigned || it.dataset.count === '0';
        it.classList.toggle('hidden', !(nameMatch && assignMatch));
      });
    }
    function pick(el) {
      document.querySelectorAll('.map-item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
      document.querySelector('.map-panel-head + .map-list')
        ?.closest('.map-panel')
        ?.querySelector('.map-panel-head')
        ?.childNodes[0] &&
        (document.querySelectorAll('.map-panel-head')[1].childNodes[0].nodeValue = el.childNodes[0].nodeValue + ' 님의 담당 의료진 ');
    }
  </script>
</body>
</html>

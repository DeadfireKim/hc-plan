<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공지 작성 · 와치관리자 — HealthCare Watch</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" />
  <link rel="stylesheet" href="../assets/app.css" />
</head>
<body>
  <div class="shell">
    <header class="gnb">
      <a class="gnb-logo" href="../index.html" title="데모 허브로 이동">
        <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
          <rect width="30" height="30" rx="8" fill="#d4af37" />
          <path d="M4 15 h5 l2.2 -6 l3.4 12 l2.4 -6 H26" fill="none" stroke="#1f3a36" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        서울본병원
      </a>
      <nav class="gnb-menu">
        <a class="gnb-item" href="../pc-admin/dashboard.html">관리자 포털</a>
        <a class="gnb-item active" href="./dashboard.html">와치관리자 포털</a>
        <a class="gnb-item" href="../pc-doctor/dashboard.html">의료진 포털</a>
      </nav>
      <div class="gnb-user">
        <button class="gnb-user-btn" onclick="document.getElementById('um').classList.toggle('hidden')">
          <span class="gnb-avatar">김</span> 김선숙
        </button>
        <div class="user-menu hidden" id="um">
          <button class="user-menu-item">로그아웃</button>
        </div>
      </div>
    </header>

    <div class="shell-body">
      <aside class="lnb">
        <div class="lnb-header">
          <button class="lnb-toggle" onclick="document.querySelector('.lnb').classList.toggle('collapsed')">☰</button>
          <span class="lnb-title">와치관리자</span>
        </div>
        <nav class="lnb-nav">
          <a class="lnb-link" href="./dashboard.html">대시보드 <span class="lnb-type-badge">S</span></a>
          <a class="lnb-link" href="./seniors.html">시니어 관리 <span class="lnb-type-badge">L</span></a>
          <a class="lnb-link" href="./medicals.html">의료진 관리 <span class="lnb-type-badge">L</span></a>
          <a class="lnb-link" href="./mapping.html">의료진·시니어 매핑 <span class="lnb-type-badge">P-MAP</span></a>
          <a class="lnb-link" href="./devices.html">기기 관리 <span class="lnb-type-badge">L</span></a>
          <a class="lnb-link active" href="./notice.html">공지사항 <span class="lnb-type-badge">L</span></a>
        </nav>
      </aside>

      <!-- ===== 콘텐츠 (F형 · 공지 작성) ===== -->
      <main class="shell-content">
        <div class="shell-content-inner">
          <div class="page-header">
            <div class="page-header-text">
              <h1 class="page-title">공지 추가 <span class="badge badge-blue type-tag">F</span></h1>
              <p class="page-desc">서울본병원 소속 시니어·보호자 대상</p>
            </div>
          </div>

          <table class="form-table">
            <colgroup><col style="width:130px" /><col /><col style="width:130px" /><col /></colgroup>
            <tbody>
              <tr><th>제목 <span class="required">*</span></th><td colspan="3"><input class="input" placeholder="공지 제목" /></td></tr>
              <tr>
                <th>대상 <span class="required">*</span></th>
                <td><select class="select"><option>전체</option><option>시니어</option><option>보호자</option><option>시니어·보호자</option></select></td>
                <th>게시 기간 <span class="required">*</span></th>
                <td><div style="display:flex; align-items:center; gap:8px; white-space:nowrap"><input class="input" type="date" style="width:auto" /> ~ <input class="input" type="date" style="width:auto" /></div></td>
              </tr>
              <tr><th>내용 <span class="required">*</span></th><td colspan="3"><textarea class="textarea" style="min-height:220px" placeholder="공지 내용을 입력하세요"></textarea></td></tr>
            </tbody>
          </table>

          <div class="detail-actions">
            <button class="btn btn-primary btn-md">저장</button>
            <a class="btn btn-secondary btn-md" href="./notice.html">취소</a>
          </div>
        </div>
      </main>
    </div>
  </div>

  <style>.hidden{display:none}</style>
  <script src="../assets/textarea-autogrow.js"></script>
</body>
</html>

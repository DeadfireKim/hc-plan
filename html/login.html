<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — HC-Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--color-primary-900) 0%,
                                           var(--color-primary-700) 100%);
    }

    .login-wrap {
      display: flex;
      width: 900px;
      min-height: 540px;
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: 0 24px 48px rgba(0,0,0,0.3);
    }

    /* 왼쪽 브랜딩 패널 */
    .login-brand {
      flex: 1;
      background: var(--color-primary-800);
      padding: var(--space-12);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #ffffff;
    }

    .login-brand__logo {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .login-brand__icon {
      width: 40px;
      height: 40px;
      background-color: var(--color-primary-500);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .login-brand__name {
      font-size: var(--text-xl);
      font-weight: var(--font-bold);
    }

    .login-brand__tagline {
      font-size: var(--text-xs);
      color: var(--color-primary-400);
      margin-top: 2px;
    }

    .login-brand__body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: var(--space-4);
    }

    .login-brand__headline {
      font-size: var(--text-2xl);
      font-weight: var(--font-bold);
      line-height: 1.35;
    }

    .login-brand__desc {
      font-size: var(--text-sm);
      color: #94a3b8;
      line-height: 1.7;
    }

    .login-brand__stats {
      display: flex;
      gap: var(--space-6);
    }

    .login-brand__stat-value {
      font-size: var(--text-2xl);
      font-weight: var(--font-bold);
      color: var(--color-primary-400);
    }

    .login-brand__stat-label {
      font-size: var(--text-xs);
      color: #94a3b8;
      margin-top: 2px;
    }

    /* 오른쪽 폼 패널 */
    .login-form-panel {
      width: 400px;
      background: var(--bg-base);
      padding: var(--space-10) var(--space-8);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-form__title {
      font-size: var(--text-2xl);
      font-weight: var(--font-bold);
      color: var(--text-primary);
      margin-bottom: var(--space-1);
    }

    .login-form__subtitle {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      margin-bottom: var(--space-8);
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    .form-label {
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      color: var(--text-primary);
    }

    .form-input {
      width: 100%;
      padding: var(--space-3) var(--space-4);
      font-size: var(--text-sm);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      outline: none;
      transition: border-color var(--transition-fast),
                  box-shadow var(--transition-fast);
      color: var(--text-primary);
    }

    .form-input:focus {
      border-color: var(--color-primary-500);
      box-shadow: 0 0 0 3px var(--color-primary-100);
    }

    .login-form__options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: var(--text-xs);
    }

    .login-form__remember {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--text-secondary);
      cursor: pointer;
    }

    .login-form__forgot {
      color: var(--color-primary-600);
      cursor: pointer;
    }

    .login-form__forgot:hover {
      text-decoration: underline;
    }

    .btn-login {
      width: 100%;
      padding: var(--space-3);
      background-color: var(--color-primary-600);
      color: #ffffff;
      font-size: var(--text-base);
      font-weight: var(--font-semibold);
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      transition: background-color var(--transition-fast);
      margin-top: var(--space-2);
    }

    .btn-login:hover {
      background-color: var(--color-primary-700);
    }

    /* 역할별 빠른 접속 (목업용) */
    .quick-access {
      margin-top: var(--space-6);
      padding-top: var(--space-6);
      border-top: 1px solid var(--border-default);
    }

    .quick-access__label {
      font-size: var(--text-xs);
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: var(--space-3);
    }

    .quick-access__btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-2);
    }

    .quick-btn {
      padding: var(--space-2) var(--space-3);
      font-size: var(--text-xs);
      font-weight: var(--font-medium);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      color: var(--text-secondary);
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: border-color var(--transition-fast),
                  color var(--transition-fast);
    }

    .quick-btn:hover {
      border-color: var(--color-primary-400);
      color: var(--color-primary-600);
    }

    .login-form__register {
      margin-top: var(--space-4);
      text-align: center;
      font-size: var(--text-xs);
      color: var(--text-secondary);
    }

    .login-form__register a {
      color: var(--color-primary-600);
      font-weight: var(--font-medium);
    }

    .login-form__register a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .login-wrap {
        flex-direction: column;
        width: 100%;
        min-height: 100vh;
        border-radius: 0;
      }

      .login-brand { display: none; }

      .login-form-panel {
        width: 100%;
        padding: var(--space-8) var(--space-6);
      }
    }
  </style>
</head>
<body>

  <div class="login-wrap">

    <!-- 브랜딩 패널 -->
    <div class="login-brand">
      <div class="login-brand__logo">
        <div class="login-brand__icon">❤</div>
        <div>
          <div class="login-brand__name">HC-Plan</div>
          <div class="login-brand__tagline">건강정보 모니터링 서비스</div>
        </div>
      </div>

      <div class="login-brand__body">
        <h2 class="login-brand__headline">
          스마트밴드 데이터로<br>
          건강을 전문적으로<br>
          추적·관리합니다
        </h2>
        <p class="login-brand__desc">
          AI 기반 일·주·월 건강 분석 리포트,<br>
          의료진 연계 위험 케이스 관리,<br>
          개인 맞춤 건강 조언을 제공합니다.
        </p>
        <div class="login-brand__stats">
          <div>
            <div class="login-brand__stat-value">9종</div>
            <div class="login-brand__stat-label">수집 건강 지표</div>
          </div>
          <div>
            <div class="login-brand__stat-value">24h</div>
            <div class="login-brand__stat-label">실시간 모니터링</div>
          </div>
          <div>
            <div class="login-brand__stat-value">AI</div>
            <div class="login-brand__stat-label">종합 분석</div>
          </div>
        </div>
      </div>

      <div style="font-size:var(--text-xs);color:#475569;">
        © 2026 HC-Plan. All rights reserved.
      </div>
    </div>

    <!-- 로그인 폼 -->
    <div class="login-form-panel">
      <h1 class="login-form__title">로그인</h1>
      <p class="login-form__subtitle">계정 정보를 입력하세요</p>

      <form class="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="email">이메일</label>
          <input class="form-input" type="email" id="email"
            placeholder="이메일을 입력하세요" value="user@example.com">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">비밀번호</label>
          <input class="form-input" type="password" id="password"
            placeholder="비밀번호를 입력하세요" value="••••••••">
        </div>

        <div class="login-form__options">
          <label class="login-form__remember">
            <input type="checkbox" checked>
            로그인 상태 유지
          </label>
          <a href="#" class="login-form__forgot">비밀번호 찾기</a>
        </div>

        <button type="submit" class="btn-login">로그인</button>
      </form>

      <!-- 목업용 역할별 빠른 접속 -->
      <div class="quick-access">
        <div class="quick-access__label">목업 빠른 접속 (역할 선택)</div>
        <div class="quick-access__btns">
          <a href="user/dashboard.html" class="quick-btn">👤 사용자</a>
          <a href="doctor/patient-list.html" class="quick-btn">🩺 의사</a>
          <a href="counselor/waiting-list.html" class="quick-btn">📞 상담사</a>
          <a href="admin/users.html" class="quick-btn">⚙️ 관리자</a>
        </div>
      </div>

      <div class="login-form__register">
        계정이 없으신가요?
        <a href="register.html">회원가입</a>
      </div>
    </div>

  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      window.location.href = 'user/dashboard.html';
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>직원 관리 — HC-Plan 관리자</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    /* Toast */
    .toast-stack { position:fixed; bottom:24px; right:24px; z-index:9999; display:flex; flex-direction:column; gap:8px; }
    .toast {
      padding:12px 18px; border-radius:10px; font-size:var(--text-sm); font-weight:500;
      color:#fff; box-shadow:0 4px 16px rgba(0,0,0,0.18); animation:toastIn .2s ease; max-width:320px;
    }
    .toast--success { background:#16a34a; }
    .toast--error   { background:#dc2626; }
    .toast--info    { background:#2563eb; }
    @keyframes toastIn { from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);} }

    .tab-bar { display:flex; gap:0; border-bottom:2px solid var(--border-default); margin-bottom:var(--space-5); }
    .tab-btn {
      padding:var(--space-3) var(--space-5); font-size:var(--text-sm); font-weight:600;
      color:var(--text-secondary); border:none; background:none; cursor:pointer;
      border-bottom:2px solid transparent; margin-bottom:-2px;
    }
    .tab-btn.active { color:var(--color-primary-600); border-bottom-color:var(--color-primary-600); }

    .staff-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-4); }

    .staff-card {
      background:var(--bg-base); border:1px solid var(--border-default);
      border-radius:var(--radius-xl); padding:var(--space-5); transition:box-shadow .15s;
    }
    .staff-card:hover { box-shadow:0 4px 16px rgba(0,0,0,.08); }
    .staff-card__header { display:flex; align-items:center; gap:var(--space-3); margin-bottom:var(--space-4); }
    .staff-card__avatar {
      width:48px; height:48px; border-radius:var(--radius-full);
      background:var(--color-primary-100); color:var(--color-primary-700);
      font-size:var(--text-lg); font-weight:700;
      display:flex; align-items:center; justify-content:center; flex-shrink:0;
    }
    .staff-card__name { font-weight:700; font-size:var(--text-base); }
    .staff-card__role { font-size:var(--text-xs); color:var(--text-secondary); margin-top:2px; }
    .staff-card__stat {
      display:flex; justify-content:space-between; font-size:var(--text-xs); color:var(--text-secondary);
      padding:var(--space-2) 0; border-bottom:1px solid var(--border-default);
    }
    .staff-card__stat:last-of-type { border-bottom:none; }
    .staff-card__stat strong { color:var(--text-primary); }
    .staff-card__actions { display:flex; gap:var(--space-2); margin-top:var(--space-4); flex-wrap:wrap; }

    .online-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:4px; }

    .action-btn {
      padding:4px 12px; font-size:var(--text-xs); border:1px solid var(--border-strong);
      border-radius:var(--radius-md); background:var(--bg-base); cursor:pointer; color:var(--text-primary); font-weight:500;
    }
    .action-btn:hover { background:var(--bg-surface); }
    .action-btn--primary { background:var(--color-primary-600); color:#fff; border-color:var(--color-primary-600); }
    .action-btn--primary:hover { background:var(--color-primary-700); }
    .action-btn--danger { color:var(--color-status-danger); border-color:rgba(239,68,68,.3); }

    /* Modal */
    .modal-overlay {
      display:none; position:fixed; inset:0;
      background:rgba(0,0,0,.45); z-index:200; align-items:center; justify-content:center;
    }
    .modal-overlay.open { display:flex; }
    .modal {
      background:var(--bg-base); border-radius:var(--radius-xl);
      padding:var(--space-6); width:520px; max-width:92vw; max-height:90vh; overflow-y:auto;
    }
    .modal__title { font-size:var(--text-lg); font-weight:700; margin-bottom:var(--space-5); }
    .modal__divider { font-size:var(--text-xs); font-weight:600; color:var(--text-secondary); margin:var(--space-4) 0 var(--space-3); border-bottom:1px solid var(--border-default); padding-bottom:var(--space-2); }
    .modal-row { display:grid; grid-template-columns:1fr 1fr; gap:var(--space-3); }
    .modal-field { margin-bottom:var(--space-3); }
    .modal-field label { font-size:var(--text-xs); color:var(--text-secondary); display:block; margin-bottom:4px; font-weight:500; }
    .modal-field input, .modal-field select, .modal-field textarea {
      width:100%; padding:var(--space-2) var(--space-3);
      border:1px solid var(--border-strong); border-radius:var(--radius-md);
      font-size:var(--text-sm); outline:none; font-family:inherit; box-sizing:border-box;
    }
    .modal-field input:focus, .modal-field select:focus, .modal-field textarea:focus {
      border-color:var(--color-primary-500); box-shadow:0 0 0 3px var(--color-primary-100);
    }

    .filter-bar { display:flex; gap:var(--space-3); margin-bottom:var(--space-5); }
    .filter-bar__search {
      flex:1; padding:var(--space-2) var(--space-3);
      border:1px solid var(--border-strong); border-radius:var(--radius-md); font-size:var(--text-sm); outline:none;
    }
    .filter-bar__search:focus { border-color:var(--color-primary-500); }

    /* ── 사이드바 접기/펼치기 ── */
    .sidebar__collapse-btn {
      margin-left: auto;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: var(--radius-sm);
      color: var(--color-primary-400);
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    .sidebar__collapse-btn:hover {
      background: rgba(255,255,255,0.1);
      color: #ffffff;
    }
    body.sidebar-collapsed .sidebar { transform: translateX(-240px); }
    body.sidebar-collapsed .main-header { left: 0; padding-left: 56px; }
    body.sidebar-collapsed .main-content { margin-left: 0; width: 100%; }
    .sidebar      { transition: transform 0.25s ease; }
    .main-header  { transition: left 0.25s ease, padding-left 0.25s ease; }
    .main-content { transition: margin-left 0.25s ease, width 0.25s ease; }
    .sidebar-open-btn {
      display: none;
      position: fixed;
      top: 12px;
      left: 12px;
      width: 36px;
      height: 36px;
      background: var(--color-primary-700);
      border: none;
      border-radius: var(--radius-md);
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #ffffff;
      z-index: 200;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      transition: background 0.15s;
    }
    .sidebar-open-btn:hover { background: var(--color-primary-600); }
    body.sidebar-collapsed .sidebar-open-btn { display: flex; }
  </style>
</head>
<body>
<div class="app-shell">

  <nav class="sidebar" id="sidebar">
    <div class="sidebar__logo">
      <div class="sidebar__logo-icon" onclick="location.href='../index.html'" style="cursor:pointer">⚙️</div>
      <div onclick="location.href='../index.html'" style="cursor:pointer;flex:1">
        <div class="sidebar__logo-text">HC-Plan</div>
        <div class="sidebar__logo-sub">관리자 포털</div>
      </div>
      <div class="sidebar__collapse-btn" onclick="toggleSidebar()" title="사이드바 접기">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
      </div>
    </div>
    <div class="sidebar__nav">
      <div class="sidebar__section-label">운영 관리</div>
      <a href="dashboard.html" class="sidebar__item">
        <svg class="sidebar__item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        운영 현황
      </a>
      <a href="users.html" class="sidebar__item">
        <svg class="sidebar__item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        사용자 관리
      </a>
      <a href="staff.html" class="sidebar__item active">
        <svg class="sidebar__item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        직원 관리
      </a>
      <a href="codes.html" class="sidebar__item">
        <svg class="sidebar__item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        코드 관리
      </a>
      <a href="settings.html" class="sidebar__item">
        <svg class="sidebar__item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"/></svg>
        시스템 설정
      </a>
    </div>
    <div class="sidebar__footer">
      <div class="sidebar__user">
        <div class="sidebar__user-avatar">관</div>
        <div class="sidebar__user-info">
          <div class="sidebar__user-name">관리자</div>
          <div class="sidebar__user-role">시스템 관리자</div>
        </div>
      </div>
    </div>
  </nav>
  <!-- 사이드바 접혔을 때 열기 버튼 -->
  <button class="sidebar-open-btn" id="sidebar-open-btn" onclick="toggleSidebar()" title="사이드바 열기">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>



  <header class="main-header">
    <div class="main-header__left">
      <div class="main-header__title">직원 관리</div>
    </div>
    <div class="main-header__right">
      <button class="action-btn action-btn--primary" onclick="openRegisterModal()">+ 직원 등록</button>
    </div>
  </header>

  <main class="main-content">
    <div class="tab-bar">
      <button class="tab-btn active" id="tabDoctor" onclick="switchTab('doctor')">의사 (<span id="doctorCount">4</span>명)</button>
      <button class="tab-btn" id="tabCounselor" onclick="switchTab('counselor')">상담사 (<span id="counselorCount">6</span>명)</button>
    </div>

    <div class="filter-bar">
      <input class="filter-bar__search" type="text" placeholder="이름 또는 전문과목 검색..." id="staffSearch" oninput="renderStaff()">
    </div>

    <div class="staff-grid" id="staffGrid"></div>
  </main>
</div>

<!-- 등록 모달 -->
<div class="modal-overlay" id="registerModal">
  <div class="modal">
    <div class="modal__title">직원 등록</div>
    <div class="modal-row">
      <div class="modal-field"><label>이름 *</label><input type="text" id="rName" placeholder="홍길동"></div>
      <div class="modal-field"><label>직책 *</label>
        <select id="rRole"><option>의사</option><option>상담사</option></select>
      </div>
    </div>
    <div class="modal-field"><label>이메일 (로그인 ID) *</label><input type="email" id="rEmail" placeholder="staff@hcplan.co.kr"></div>
    <div class="modal-row">
      <div class="modal-field"><label>전화번호</label><input type="text" id="rPhone" placeholder="010-0000-0000"></div>
      <div class="modal-field"><label>전문 과목 / 담당 업무</label><input type="text" id="rSpec" placeholder="내과, 가정의학과 등"></div>
    </div>
    <div class="modal-field"><label>임시 비밀번호 *</label><input type="password" id="rPw" placeholder="8자 이상, 영문+숫자+특수문자"></div>
    <div style="display:flex;gap:var(--space-3);justify-content:flex-end;margin-top:var(--space-2)">
      <button class="action-btn" onclick="closeRegisterModal()">취소</button>
      <button class="action-btn action-btn--primary" onclick="saveRegister()">등록</button>
    </div>
  </div>
</div>

<!-- 편집 모달 -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal__title">직원 편집</div>
    <input type="hidden" id="eId">
    <input type="hidden" id="eTab">

    <div class="modal__divider">기본 정보</div>
    <div class="modal-row">
      <div class="modal-field"><label>이름 *</label><input type="text" id="eName"></div>
      <div class="modal-field"><label>직책</label>
        <select id="eRole"><option>의사</option><option>상담사</option></select>
      </div>
    </div>
    <div class="modal-field"><label>이메일</label><input type="email" id="eEmail"></div>
    <div class="modal-row">
      <div class="modal-field"><label>전화번호</label><input type="text" id="ePhone"></div>
      <div class="modal-field"><label>전문 과목 / 담당 업무</label><input type="text" id="eSpec"></div>
    </div>

    <div class="modal__divider">상태 및 담당</div>
    <div class="modal-row">
      <div class="modal-field"><label>근무 상태</label>
        <select id="eOnline"><option value="true">근무 중</option><option value="false">부재</option></select>
      </div>
      <div class="modal-field"><label>담당 사용자 수</label><input type="number" id="ePatients" min="0"></div>
    </div>
    <div class="modal-row">
      <div class="modal-field"><label>입사일</label><input type="date" id="eJoined"></div>
      <div class="modal-field"><label>권한 레벨</label>
        <select id="eLevel">
          <option>일반</option><option>시니어</option><option>팀장</option>
        </select>
      </div>
    </div>

    <div style="display:flex;gap:var(--space-3);justify-content:flex-end;margin-top:var(--space-3)">
      <button class="action-btn" onclick="closeEditModal()">취소</button>
      <button class="action-btn action-btn--primary" onclick="saveEdit()">저장</button>
    </div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script>
const doctors = [
  { id:'d001', name:'김민호', role:'의사', spec:'내과 / 가정의학과', patients:124, reviews:18, today:8, joined:'2024-03-01', online:true,  level:'팀장' },
  { id:'d002', name:'박서연', role:'의사', spec:'신경과 / 수면의학',  patients:89,  reviews:12, today:5, joined:'2024-06-15', online:true,  level:'시니어' },
  { id:'d003', name:'최준혁', role:'의사', spec:'순환기내과',          patients:156, reviews:24, today:9, joined:'2023-11-01', online:true,  level:'시니어' },
  { id:'d004', name:'윤미래', role:'의사', spec:'내분비내과',           patients:71,  reviews: 9, today:0, joined:'2025-01-10', online:false, level:'일반' },
];
const counselors = [
  { id:'c001', name:'이수민', role:'상담사', spec:'위험/긴급 상담 전담', patients:48, reviews:0, today:12, joined:'2024-01-15', online:true,  level:'팀장' },
  { id:'c002', name:'박지훈', role:'상담사', spec:'정기 상담 전담',       patients:52, reviews:0, today:10, joined:'2024-02-01', online:true,  level:'시니어' },
  { id:'c003', name:'강채원', role:'상담사', spec:'이용기간 / 민원',      patients:41, reviews:0, today: 8, joined:'2024-04-20', online:true,  level:'일반' },
  { id:'c004', name:'오민준', role:'상담사', spec:'신규 사용자 온보딩',   patients:35, reviews:0, today: 7, joined:'2024-07-01', online:false, level:'일반' },
  { id:'c005', name:'정유진', role:'상담사', spec:'고령 사용자 전담',     patients:29, reviews:0, today: 6, joined:'2024-08-10', online:true,  level:'일반' },
  { id:'c006', name:'한소희', role:'상담사', spec:'기기 연동 지원',       patients:22, reviews:0, today: 4, joined:'2025-02-01', online:false, level:'일반' },
];

let currentTab = 'doctor';

function toast(msg, type='success') {
  const el = document.createElement('div');
  el.className = `toast toast--${type}`;
  el.textContent = msg;
  document.getElementById('toastStack').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function updateTabCounts() {
  document.getElementById('doctorCount').textContent = doctors.length;
  document.getElementById('counselorCount').textContent = counselors.length;
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabDoctor').classList.toggle('active', tab==='doctor');
  document.getElementById('tabCounselor').classList.toggle('active', tab==='counselor');
  renderStaff();
}

function renderStaff() {
  const q = document.getElementById('staffSearch').value.toLowerCase();
  const data = (currentTab==='doctor' ? doctors : counselors)
    .filter(s => !q || s.name.includes(q) || s.spec.toLowerCase().includes(q));

  document.getElementById('staffGrid').innerHTML = data.map(s => `
    <div class="staff-card">
      <div class="staff-card__header">
        <div class="staff-card__avatar">${s.name[0]}</div>
        <div>
          <div class="staff-card__name">
            <span class="online-dot" style="background:${s.online?'var(--color-status-normal)':'var(--text-tertiary)'}"></span>
            ${s.name}
            <span style="font-size:10px;padding:1px 6px;border-radius:100px;background:var(--bg-surface);color:var(--text-secondary);font-weight:600;margin-left:4px">${s.level}</span>
          </div>
          <div class="staff-card__role">${s.role} · ${s.id}</div>
        </div>
      </div>
      <div class="staff-card__stat"><span>전문 / 담당</span><strong>${s.spec}</strong></div>
      <div class="staff-card__stat"><span>담당 사용자</span><strong>${s.patients}명</strong></div>
      ${currentTab==='doctor'
        ? `<div class="staff-card__stat"><span>총 소견 수</span><strong>${s.reviews}건</strong></div>`
        : `<div class="staff-card__stat"><span>오늘 상담</span><strong>${s.today}건</strong></div>`}
      <div class="staff-card__stat"><span>입사일</span><strong>${s.joined.replace(/-/g,'.')}</strong></div>
      <div class="staff-card__stat"><span>상태</span>
        <strong style="color:${s.online?'var(--color-status-normal)':'var(--text-tertiary)'}">${s.online?'● 근무 중':'○ 부재'}</strong>
      </div>
      <div class="staff-card__actions">
        <button class="action-btn action-btn--primary" onclick="openEditModal('${s.id}')">편집</button>
        <button class="action-btn" onclick="resetPw('${s.name}')">PW 초기화</button>
        <button class="action-btn action-btn--danger" onclick="deactivate('${s.id}','${s.name}')">비활성화</button>
      </div>
    </div>
  `).join('') || `<div style="grid-column:span 3;text-align:center;padding:var(--space-8);color:var(--text-tertiary)">검색 결과가 없습니다.</div>`;
}

// 편집 모달
function openEditModal(id) {
  const arr = currentTab==='doctor' ? doctors : counselors;
  const s = arr.find(x => x.id===id);
  document.getElementById('eId').value = s.id;
  document.getElementById('eTab').value = currentTab;
  document.getElementById('eName').value = s.name;
  document.getElementById('eRole').value = s.role;
  document.getElementById('eEmail').value = `${s.id}@hcplan.co.kr`;
  document.getElementById('ePhone').value = '010-****-' + (1000 + arr.indexOf(s));
  document.getElementById('eSpec').value = s.spec;
  document.getElementById('eOnline').value = String(s.online);
  document.getElementById('ePatients').value = s.patients;
  document.getElementById('eJoined').value = s.joined;
  document.getElementById('eLevel').value = s.level;
  document.getElementById('editModal').classList.add('open');
}
function closeEditModal() { document.getElementById('editModal').classList.remove('open'); }
function saveEdit() {
  const id = document.getElementById('eId').value;
  const tab = document.getElementById('eTab').value;
  const arr = tab==='doctor' ? doctors : counselors;
  const s = arr.find(x => x.id===id);
  const name = document.getElementById('eName').value.trim();
  if (!name) { toast('이름을 입력하세요', 'error'); return; }
  s.name    = name;
  s.role    = document.getElementById('eRole').value;
  s.spec    = document.getElementById('eSpec').value;
  s.online  = document.getElementById('eOnline').value === 'true';
  s.patients= parseInt(document.getElementById('ePatients').value) || 0;
  s.joined  = document.getElementById('eJoined').value;
  s.level   = document.getElementById('eLevel').value;
  closeEditModal();
  renderStaff();
  toast(`${name} 정보가 저장되었습니다`);
}

// 등록 모달
function openRegisterModal() { document.getElementById('registerModal').classList.add('open'); }
function closeRegisterModal() { document.getElementById('registerModal').classList.remove('open'); }
function saveRegister() {
  const name = document.getElementById('rName').value.trim();
  const email = document.getElementById('rEmail').value.trim();
  const pw = document.getElementById('rPw').value;
  if (!name || !email || !pw) { toast('이름, 이메일, 비밀번호는 필수입니다', 'error'); return; }
  const role = document.getElementById('rRole').value;
  const newId = (role==='의사' ? 'd' : 'c') + String((role==='의사'?doctors:counselors).length + 1).padStart(3,'0');
  const newStaff = {
    id: newId, name, role,
    spec: document.getElementById('rSpec').value || '미지정',
    patients: 0, reviews: 0, today: 0,
    joined: new Date().toISOString().slice(0,10),
    online: false, level: '일반'
  };
  (role==='의사' ? doctors : counselors).push(newStaff);
  updateTabCounts();
  closeRegisterModal();
  if ((role==='의사' && currentTab==='doctor') || (role==='상담사' && currentTab==='counselor')) renderStaff();
  toast(`${name} 등록이 완료되었습니다. 임시 비밀번호가 이메일로 발송됩니다`);
}

function resetPw(name) {
  if (confirm(`${name}의 비밀번호를 초기화하시겠습니까?`)) {
    toast(`${name}의 임시 비밀번호가 이메일로 발송되었습니다`, 'info');
  }
}
function deactivate(id, name) {
  if (!confirm(`${name} 계정을 비활성화하시겠습니까?`)) return;
  const arr = currentTab==='doctor' ? doctors : counselors;
  const s = arr.find(x => x.id===id);
  s.online = false;
  renderStaff();
  toast(`${name} 계정이 비활성화되었습니다`, 'info');
}


renderStaff();

  // 사이드바 접기/펼치기
  function toggleSidebar() {
    document.body.classList.toggle('sidebar-collapsed');
  }
</script>
</body>
</html>

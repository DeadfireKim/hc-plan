<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>코드 관리 — HC-Plan 관리자</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    /* Toast */
    .toast-stack { position:fixed; bottom:24px; right:24px; z-index:9999; display:flex; flex-direction:column; gap:8px; }
    .toast {
      padding:12px 18px; border-radius:10px; font-size:var(--text-sm); font-weight:500;
      color:#fff; box-shadow:0 4px 16px rgba(0,0,0,.18); animation:toastIn .2s ease; max-width:320px;
    }
    .toast--success { background:#16a34a; }
    .toast--error   { background:#dc2626; }
    .toast--info    { background:#2563eb; }
    @keyframes toastIn { from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);} }

    .code-layout { display:grid; grid-template-columns:260px 1fr; gap:var(--space-5); }

    .code-tree {
      background:var(--bg-base); border:1px solid var(--border-default);
      border-radius:var(--radius-xl); padding:var(--space-4); height:fit-content; position:sticky; top:24px;
    }
    .code-tree__title { font-size:var(--text-sm); font-weight:700; color:var(--text-primary); margin-bottom:var(--space-3); }
    .tree-group { margin-bottom:var(--space-3); }
    .tree-group__label {
      font-size:var(--text-xs); font-weight:600; color:var(--text-secondary);
      padding:var(--space-1) var(--space-2); text-transform:uppercase; letter-spacing:.05em;
    }
    .tree-item {
      display:flex; align-items:center; justify-content:space-between;
      padding:var(--space-2) var(--space-3); border-radius:var(--radius-md);
      font-size:var(--text-sm); cursor:pointer; color:var(--text-primary);
    }
    .tree-item:hover { background:var(--bg-surface); }
    .tree-item.active { background:var(--color-primary-50); color:var(--color-primary-700); font-weight:600; }
    .tree-item__count {
      font-size:10px; padding:1px 6px; border-radius:100px;
      background:var(--bg-surface); color:var(--text-secondary);
    }
    .tree-item.active .tree-item__count { background:var(--color-primary-100); color:var(--color-primary-700); }

    .data-table { width:100%; border-collapse:collapse; font-size:var(--text-sm); }
    .data-table th {
      text-align:left; padding:var(--space-3) var(--space-4);
      border-bottom:2px solid var(--border-default);
      font-size:var(--text-xs); color:var(--text-secondary); font-weight:600;
    }
    .data-table td {
      padding:var(--space-2) var(--space-4);
      border-bottom:1px solid var(--border-default); vertical-align:middle;
    }
    .data-table tr:last-child td { border-bottom:none; }
    .data-table tr:hover td { background:var(--bg-surface); }
    .data-table tr.editing td { background:var(--color-primary-50); }

    .action-btn {
      padding:3px 10px; font-size:11px; border:1px solid var(--border-strong);
      border-radius:var(--radius-md); background:var(--bg-base); cursor:pointer; color:var(--text-primary);
    }
    .action-btn:hover { background:var(--bg-surface); }
    .action-btn--primary { background:var(--color-primary-600); color:#fff; border-color:var(--color-primary-600); }
    .action-btn--danger { color:var(--color-status-danger); border-color:rgba(239,68,68,.3); }
    .action-btn--save { background:var(--color-status-normal); color:#fff; border-color:var(--color-status-normal); }

    .inline-input {
      padding:var(--space-1) var(--space-2); font-size:var(--text-sm);
      border:1px solid var(--color-primary-400); border-radius:var(--radius-sm);
      outline:none; width:100%; background:#fff;
      box-shadow:0 0 0 2px var(--color-primary-100);
    }

    .use-toggle {
      width:36px; height:20px; border-radius:100px; border:none; cursor:pointer;
      position:relative; transition:background .2s; flex-shrink:0;
    }
    .use-toggle::after {
      content:''; position:absolute; top:3px; left:3px;
      width:14px; height:14px; border-radius:100px;
      background:#fff; transition:left .2s;
    }
    .use-toggle.on  { background:var(--color-status-normal); }
    .use-toggle.on::after { left:19px; }
    .use-toggle.off { background:var(--text-tertiary); }

    .add-row { background:var(--color-primary-50); display:none; }
    .add-row.open { display:table-row; }
    .add-input {
      padding:var(--space-1) var(--space-2); font-size:var(--text-sm);
      border:1px solid var(--border-strong); border-radius:var(--radius-sm);
      outline:none; width:100%;
    }
    .add-input:focus { border-color:var(--color-primary-500); }
  </style>
</head>
<body>
<div class="app-shell">

  <nav class="sidebar" id="sidebar">
    <div class="sidebar__logo" onclick="location.href='../index.html'" style="cursor:pointer">
      <div class="sidebar__logo-icon">⚙️</div>
      <div>
        <div class="sidebar__logo-text">HC-Plan</div>
        <div class="sidebar__logo-sub">관리자 포털</div>
      </div>
    </div>
    <div class="sidebar__nav">
      <div class="sidebar__section-label">운영 관리</div>
      <a href="dashboard.html" class="sidebar__item">
        <svg class="sidebar__item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        운영 현황
      </a>
      <a href="users.html" class="sidebar__item">
        <svg class="sidebar__item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        사용자 관리
      </a>
      <a href="staff.html" class="sidebar__item">
        <svg class="sidebar__item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        직원 관리
      </a>
      <a href="codes.html" class="sidebar__item active">
        <svg class="sidebar__item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        코드 관리
      </a>
      <a href="settings.html" class="sidebar__item">
        <svg class="sidebar__item-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"/></svg>
        시스템 설정
      </a>
    </div>
    <div class="sidebar__footer">
      <div class="sidebar__user">
        <div class="sidebar__user-avatar">관</div>
        <div class="sidebar__user-info">
          <div class="sidebar__user-name">관리자</div>
          <div class="sidebar__user-role">시스템 관리자</div>
        </div>
      </div>
    </div>
  </nav>


  <header class="main-header">
    <div class="main-header__left">
      <div class="main-header__title">코드 관리</div>
    </div>
  </header>

  <main class="main-content">
    <div class="code-layout">

      <!-- 트리 -->
      <div class="code-tree">
        <div class="code-tree__title">코드 그룹</div>
        <div class="tree-group">
          <div class="tree-group__label">이용 플랜</div>
          <div class="tree-item active" id="tree-plan" onclick="selectGroup('plan',this)">구독 플랜 <span class="tree-item__count" id="cnt-plan">4</span></div>
        </div>
        <div class="tree-group">
          <div class="tree-group__label">상담 관련</div>
          <div class="tree-item" id="tree-callType" onclick="selectGroup('callType',this)">상담 유형 <span class="tree-item__count" id="cnt-callType">5</span></div>
          <div class="tree-item" id="tree-followup" onclick="selectGroup('followup',this)">후속 조치 <span class="tree-item__count" id="cnt-followup">6</span></div>
        </div>
        <div class="tree-group">
          <div class="tree-group__label">의사 소견</div>
          <div class="tree-item" id="tree-opinionType" onclick="selectGroup('opinionType',this)">소견 유형 <span class="tree-item__count" id="cnt-opinionType">4</span></div>
          <div class="tree-item" id="tree-priority" onclick="selectGroup('priority',this)">우선순위 <span class="tree-item__count" id="cnt-priority">4</span></div>
        </div>
        <div class="tree-group">
          <div class="tree-group__label">시스템</div>
          <div class="tree-item" id="tree-grade" onclick="selectGroup('grade',this)">건강 등급 <span class="tree-item__count" id="cnt-grade">4</span></div>
          <div class="tree-item" id="tree-device" onclick="selectGroup('device',this)">기기 유형 <span class="tree-item__count" id="cnt-device">3</span></div>
        </div>
      </div>

      <!-- 에디터 -->
      <div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-4)">
          <div style="font-size:var(--text-base);font-weight:700" id="editorTitle">구독 플랜</div>
          <button class="action-btn action-btn--primary" onclick="toggleAddRow()">+ 코드 추가</button>
        </div>

        <div class="card">
          <div class="card__body" style="padding:0">
            <table class="data-table">
              <thead>
                <tr>
                  <th style="width:40px">순서</th>
                  <th>코드값</th>
                  <th>표시명 (한글)</th>
                  <th>설명</th>
                  <th style="width:60px">사용</th>
                  <th style="width:120px">액션</th>
                </tr>
              </thead>
              <tbody id="codeTableBody"></tbody>
              <tbody>
                <tr class="add-row" id="addRow">
                  <td><input class="add-input" id="addOrder" type="number" placeholder="순서" style="width:48px"></td>
                  <td><input class="add-input" id="addCode" type="text" placeholder="CODE_VALUE" style="font-family:monospace"></td>
                  <td><input class="add-input" id="addLabel" type="text" placeholder="표시명"></td>
                  <td><input class="add-input" id="addDesc" type="text" placeholder="설명 (선택)"></td>
                  <td></td>
                  <td>
                    <div style="display:flex;gap:4px">
                      <button class="action-btn action-btn--save" onclick="addCode()">추가</button>
                      <button class="action-btn" onclick="toggleAddRow()">취소</button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        <div style="font-size:var(--text-xs);color:var(--text-tertiary);margin-top:var(--space-3)">
          * 행을 클릭하여 인라인 편집할 수 있습니다. 코드값 변경은 시스템 전체에 영향을 줍니다.
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast-stack" id="toastStack"></div>

<script>
const codeGroups = {
  plan:       { title:'구독 플랜', codes:[
    {order:1,code:'BASIC',    label:'Basic',    desc:'기본 모니터링, 월 1회 상담',  use:true},
    {order:2,code:'STANDARD', label:'Standard', desc:'주간 리포트, 월 4회 상담',    use:true},
    {order:3,code:'PREMIUM',  label:'Premium',  desc:'실시간 알림, 무제한 상담',     use:true},
    {order:4,code:'DEMO',     label:'Demo',     desc:'30일 체험, 기능 제한',         use:true},
  ]},
  callType:   { title:'상담 유형', codes:[
    {order:1,code:'EMERGENCY',label:'긴급 상담',     desc:'위험 등급 즉시 상담',  use:true},
    {order:2,code:'REGULAR',  label:'정기 상담',     desc:'예정된 정기 상담',     use:true},
    {order:3,code:'CHECK',    label:'상태 확인',     desc:'간단한 현황 확인',     use:true},
    {order:4,code:'INQUIRY',  label:'이용기간 문의', desc:'구독/만료 문의',       use:true},
    {order:5,code:'ETC',      label:'기타',          desc:'기타 상담',            use:true},
  ]},
  followup:   { title:'후속 조치', codes:[
    {order:1,code:'RESERVED', label:'예약 완료',     desc:'병원/검사 예약 완료',  use:true},
    {order:2,code:'RECALL',   label:'재연락 필요',   desc:'상담사 재연락 필요',   use:true},
    {order:3,code:'DOCTOR',   label:'의사 검토 요청',desc:'의사 소견 요청',       use:true},
    {order:4,code:'EXTEND',   label:'이용기간 연장', desc:'이용기간 연장 처리',   use:true},
    {order:5,code:'OBSERVE',  label:'관찰 지속',     desc:'현 상태 지속 관찰',    use:true},
    {order:6,code:'NONE',     label:'조치 없음',     desc:'조치 불필요',          use:true},
  ]},
  opinionType:{ title:'소견 유형', codes:[
    {order:1,code:'REVIEW',   label:'검사 권고',   desc:'검사/진료 권고 소견',  use:true},
    {order:2,code:'RECOMMEND',label:'전문의 의뢰', desc:'전문의 진료 의뢰',     use:true},
    {order:3,code:'URGENT',   label:'긴급 입원',   desc:'즉각적 입원 필요',     use:true},
    {order:4,code:'NORMAL',   label:'정상 범위',   desc:'정상 범위 내 소견',    use:true},
  ]},
  priority:   { title:'우선순위', codes:[
    {order:1,code:'CRITICAL', label:'위급', desc:'즉각 조치 필요',  use:true},
    {order:2,code:'HIGH',     label:'높음', desc:'24시간 내 조치',  use:true},
    {order:3,code:'MEDIUM',   label:'보통', desc:'1주일 내 조치',   use:true},
    {order:4,code:'LOW',      label:'낮음', desc:'일반 관찰',       use:true},
  ]},
  grade:      { title:'건강 등급', codes:[
    {order:1,code:'NORMAL',   label:'정상', desc:'정상 범위',       use:true},
    {order:2,code:'CAUTION',  label:'주의', desc:'경미한 이상',     use:true},
    {order:3,code:'ABNORMAL', label:'이상', desc:'이상 징후',       use:true},
    {order:4,code:'DANGER',   label:'위험', desc:'즉각 조치 필요',  use:true},
  ]},
  device:     { title:'기기 유형', codes:[
    {order:1,code:'WATCH',    label:'스마트워치',  desc:'손목 착용 웨어러블', use:true},
    {order:2,code:'BAND',     label:'스마트밴드',  desc:'피트니스 밴드',      use:true},
    {order:3,code:'PATCH',    label:'패치형 센서', desc:'피부 부착형',        use:false},
  ]},
};

let currentGroup = 'plan';
let editingRow = null; // index being edited inline

function toast(msg, type='success') {
  const el = document.createElement('div');
  el.className = `toast toast--${type}`;
  el.textContent = msg;
  document.getElementById('toastStack').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function selectGroup(key, el) {
  currentGroup = key;
  document.querySelectorAll('.tree-item').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('editorTitle').textContent = codeGroups[key].title;
  editingRow = null;
  closeAddRow();
  renderCodes();
}

function renderCodes() {
  const codes = codeGroups[currentGroup].codes;
  document.getElementById(`cnt-${currentGroup}`).textContent = codes.length;
  document.getElementById('codeTableBody').innerHTML = codes.map((c, i) => {
    if (editingRow === i) {
      return `
      <tr class="editing">
        <td><input class="inline-input" id="ei-order" type="number" value="${c.order}" style="width:48px"></td>
        <td><input class="inline-input" id="ei-code" type="text" value="${c.code}" style="font-family:monospace;text-transform:uppercase"></td>
        <td><input class="inline-input" id="ei-label" type="text" value="${c.label}"></td>
        <td><input class="inline-input" id="ei-desc" type="text" value="${c.desc}"></td>
        <td><button class="use-toggle ${c.use?'on':'off'}" onclick="toggleUse(${i})"></button></td>
        <td>
          <div style="display:flex;gap:4px">
            <button class="action-btn action-btn--save" onclick="saveInline(${i})">저장</button>
            <button class="action-btn" onclick="cancelInline()">취소</button>
          </div>
        </td>
      </tr>`;
    }
    return `
    <tr onclick="startInline(${i})" style="cursor:pointer" title="클릭하여 편집">
      <td style="color:var(--text-tertiary)">${c.order}</td>
      <td><code style="font-size:var(--text-xs);background:var(--bg-surface);padding:2px 6px;border-radius:var(--radius-sm);font-family:monospace">${c.code}</code></td>
      <td><strong>${c.label}</strong></td>
      <td style="color:var(--text-secondary);font-size:var(--text-xs)">${c.desc}</td>
      <td><button class="use-toggle ${c.use?'on':'off'}" onclick="event.stopPropagation();toggleUse(${i})" title="${c.use?'사용 중':'미사용'}"></button></td>
      <td onclick="event.stopPropagation()">
        <button class="action-btn action-btn--danger" onclick="deleteCode(${i})">삭제</button>
      </td>
    </tr>`;
  }).join('');
}

function startInline(i) {
  if (editingRow === i) return;
  editingRow = i;
  renderCodes();
  // focus first input
  setTimeout(() => { const inp = document.getElementById('ei-label'); if(inp) inp.focus(); }, 50);
}

function cancelInline() { editingRow = null; renderCodes(); }

function saveInline(i) {
  const c = codeGroups[currentGroup].codes[i];
  const label = document.getElementById('ei-label').value.trim();
  if (!label) { toast('표시명은 필수입니다', 'error'); return; }
  c.order = parseInt(document.getElementById('ei-order').value) || c.order;
  c.code  = document.getElementById('ei-code').value.trim().toUpperCase() || c.code;
  c.label = label;
  c.desc  = document.getElementById('ei-desc').value.trim();
  editingRow = null;
  renderCodes();
  toast(`'${c.label}' 코드가 수정되었습니다`);
}

function toggleUse(i) {
  codeGroups[currentGroup].codes[i].use = !codeGroups[currentGroup].codes[i].use;
  const c = codeGroups[currentGroup].codes[i];
  toast(`'${c.label}' 코드가 ${c.use?'활성화':'비활성화'}되었습니다`, c.use?'success':'info');
  if (editingRow === i) editingRow = null;
  renderCodes();
}

function deleteCode(i) {
  const c = codeGroups[currentGroup].codes[i];
  if (!confirm(`'${c.label}' 코드를 삭제하시겠습니까?`)) return;
  codeGroups[currentGroup].codes.splice(i, 1);
  editingRow = null;
  renderCodes();
  toast(`'${c.label}' 코드가 삭제되었습니다`, 'info');
}

function toggleAddRow() {
  const row = document.getElementById('addRow');
  const isOpen = row.classList.toggle('open');
  if (isOpen) {
    editingRow = null;
    renderCodes();
    document.getElementById('addCode').focus();
    document.getElementById('addOrder').value = codeGroups[currentGroup].codes.length + 1;
  }
}
function closeAddRow() { document.getElementById('addRow').classList.remove('open'); }

function addCode() {
  const code = document.getElementById('addCode').value.trim().toUpperCase();
  const label = document.getElementById('addLabel').value.trim();
  if (!code || !label) { toast('코드값과 표시명은 필수입니다', 'error'); return; }
  const order = parseInt(document.getElementById('addOrder').value) || codeGroups[currentGroup].codes.length + 1;
  const desc = document.getElementById('addDesc').value.trim();
  codeGroups[currentGroup].codes.push({ order, code, label, desc, use:true });
  document.getElementById('addCode').value = '';
  document.getElementById('addLabel').value = '';
  document.getElementById('addDesc').value = '';
  closeAddRow();
  renderCodes();
  toast(`'${label}' 코드가 추가되었습니다`);
}


renderCodes();
</script>
</body>
</html>
